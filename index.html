<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英文智慧選課測驗系統</title>
  <style>
    :root { --bg: #0f172a; --box: #1e293b; --primary: #3b82f6; --accent: #ef4444; --text: #f8fafc; --success: #10b981; --purple: #8b5cf6; }
    body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    .container { background: var(--box); border-radius: 15px; padding: 25px; width: 90%; max-width: 600px; margin: 20px 0; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2, h3 { text-align: center; color: white; margin-top: 0; }
    .title-highlight { color: #38bdf8; }
    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #94a3b8; font-weight: bold; }
    input, select, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; box-sizing: border-box; background: #0f172a; color: white; font-size: 16px; margin-bottom: 10px; }
    input:focus, select:focus { outline: none; border-color: var(--primary); }
    button { background: var(--primary); border: none; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; color: white; }
    button:hover { opacity: 0.9; transform: translateY(-2px); }
    .btn-secondary { background: #475569; }
    .btn-secondary:hover { background: #64748b; }
    .btn-accent { background: var(--accent); }
    .btn-purple { background: var(--purple); }
    .hidden { display: none !important; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; margin-bottom: 15px; }
    
    .table-container { overflow-x: auto; margin-top: 15px; border-radius: 8px; border: 1px solid #334155; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; white-space: nowrap; }
    th, td { padding: 10px; border-bottom: 1px solid #334155; text-align: center; }
    th { background: #0f172a; color: #38bdf8; position: sticky; top: 0; }
    tr:hover { background: #334155; }
    
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
    .menu-btn { height: 100px; font-size: 18px; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .menu-btn span { font-size: 24px; margin-bottom: 8px; }

    /* 學習館單字與句子卡片 */
    .word-card { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 15px; margin-bottom: 12px; text-align: left; position: relative; }
    .word-title { font-size: 20px; font-weight: bold; color: #38bdf8; display: flex; justify-content: space-between; align-items: center; }
    .word-meaning { font-size: 16px; color: #10b981; margin: 5px 0 10px 0; font-weight: bold; }
    .word-sentence { font-size: 14px; color: #cbd5e1; background: #1e293b; padding: 10px; border-radius: 6px; border-left: 3px solid var(--purple); }
    .tts-btn { width: auto; padding: 4px 10px; font-size: 13px; margin: 0; background: #334155; border-radius: 6px; }
  </style>
</head>
<body>

  <!-- 1. 登入畫面 -->
  <div class="container" id="login-screen">
    <h2 class="title-highlight">英文智慧選課測驗系統</h2>
    <p style="font-size: 13px; color: #94a3b8; text-align:center;">會員安全登入（支援表單即時註冊與備用庫驗證）</p>
    <div class="input-group">
      <label>帳號</label>
      <input type="text" id="login-account" placeholder="請輸入帳號">
    </div>
    <div class="input-group">
      <label>密碼</label>
      <input type="password" id="login-password" placeholder="請輸入密碼">
    </div>
    <button id="login-btn">安全登入</button>
    <button id="go-register-btn" class="btn-secondary">註冊新帳號 (前往表單)</button>
    <p id="login-msg" style="color: var(--accent); text-align: center; font-weight: bold; margin-top: 15px;"></p>
  </div>

  <!-- 2. 主選單大廳 -->
  <div class="container hidden" id="main-menu">
    <div class="header">
      <div>
        <h3 style="margin:0; text-align: left;" class="title-highlight">系統大廳</h3>
        <span id="user-name-display" style="color: #94a3b8; font-size: 14px;"></span>
      </div>
      <button id="logout-btn" style="width: auto; padding: 6px 15px;" class="btn-secondary">登出</button>
    </div>

    <div class="menu-grid">
      <button class="menu-btn" onclick="showScreen('quiz-setup-screen')"><span>📝</span>智慧選課測驗</button>
      <button class="menu-btn btn-purple" onclick="openLearningPavilion()"><span>📚</span>學習館</button>
      <button class="menu-btn" style="background: #10b981; grid-column: span 2;" onclick="loadAndShowScores()"><span>📊</span>成績紀錄與後台</button>
    </div>
  </div>

  <!-- 3. 智慧選課測驗設定 -->
  <div class="container hidden" id="quiz-setup-screen">
    <div class="header">
      <h3 style="margin:0;" class="title-highlight">智慧選課與範圍設定</h3>
      <button onclick="showScreen('main-menu')" style="width: auto; padding: 5px 15px;" class="btn-secondary">返回</button>
    </div>
    <div id="selection-area">
      <div class="input-group"><label>Step 1: 個人學歷</label><select id="step1-stage"><option value="國小">國小</option><option value="國中" selected>國中</option><option value="高中">高中</option></select></div>
      <div class="input-group"><label>Step 2: 測驗科目</label><select id="step4-subject"><option value="英文單字">英文單字</option><option value="英文文法">英文文法</option></select></div>
      <div class="input-group"><label>Step 3: 版本選擇</label><select id="step5-edition"><option value="翰林版">翰林版</option><option value="康軒版">康軒版</option><option value="南一版">南一版</option></select></div>
      <div class="input-group"><label>Step 4: 版本學年度</label><select id="step6-year"><option value="115上學年度">115上學年度</option><option value="115下學年度">115下學年度</option></select></div>
      <div class="input-group"><label>Step 5: 課程/段考範圍</label><select id="step7-scope"><option value="第一次段考 (U1~U2)">第一次段考 (U1~U2)</option><option value="第二次段考/期中考 (U3~U4)">第二次段考/期中考 (U3~U4)</option><option value="全部單字">全部單字</option></select></div>
      <button id="start-quiz-btn" class="btn-accent" style="height: 50px; font-size: 18px;">開始測驗</button>
    </div>
  </div>

  <!-- 4. 學習館 (已完整開啟，自動連動單字與句子) -->
  <div class="container hidden" id="learning-pavilion-screen" style="max-width: 700px;">
    <div class="header">
      <h3 style="margin:0; color: var(--purple);">📚 學習館 - 單字與句子複習</h3>
      <button onclick="showScreen('main-menu')" style="width: auto; padding: 5px 15px;" class="btn-secondary">返回</button>
    </div>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
      <div class="input-group">
        <label>1. 複習學歷</label>
        <select id="learn-stage" onchange="renderLearningContent()"><option value="全部學歷" selected>全部學歷</option><option value="國小">國小</option><option value="國中">國中</option><option value="高中">高中</option></select>
      </div>
      <div class="input-group">
        <label>2. 測驗科目</label>
        <select id="learn-subject" onchange="renderLearningContent()"><option value="英文單字" selected>英文單字</option><option value="英文文法">英文文法</option></select>
      </div>
      <div class="input-group">
        <label>3. 複習版本</label>
        <select id="learn-edition" onchange="renderLearningContent()"><option value="全部版本" selected>全部版本</option><option value="翰林版">翰林版</option><option value="康軒版">康軒版</option><option value="南一版">南一版</option></select>
      </div>
      <div class="input-group">
        <label>4. 版本學年度</label>
        <select id="learn-year" onchange="renderLearningContent()"><option value="最新的" selected>最新的</option><option value="115上學年度">115上學年度</option><option value="115下學年度">115下學年度</option></select>
      </div>
    </div>
    <div class="input-group">
      <label>5. 課程 / 單元 / 段考範圍</label>
      <select id="learn-scope" onchange="renderLearningContent()"><option value="全部課程 / 單元 / 段考範圍" selected>全部課程 / 單元 / 段考範圍</option><option value="第一次段考 (U1~U2)">第一次段考 (U1~U2)</option><option value="第二次段考/期中考 (U3~U4)">第二次段考/期中考 (U3~U4)</option></select>
    </div>

    <!-- 學習內容卡片列表 -->
    <div id="learning-content-list" style="margin-top: 15px; max-height: 450px; overflow-y: auto;"></div>
  </div>

  <!-- 5. 成績紀錄與後台 -->
  <div class="container hidden" id="admin-screen" style="max-width: 900px;">
    <div class="header">
      <h3 style="margin:0; color: #10b981;">📊 成績紀錄與管理</h3>
      <button onclick="showScreen('main-menu')" style="width: auto; padding: 5px 15px;" class="btn-secondary">返回</button>
    </div>
    <p id="admin-notice" style="font-size: 13px; color: #94a3b8;"></p>
    
    <div id="bind-search-area" class="input-group hidden" style="background: #0f172a; padding: 15px; border-radius: 8px;">
      <label style="color: #38bdf8;">🔍 綁定學生查詢 (老師/家長專用)</label>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="bind-student-account" placeholder="請輸入學生或學員的帳號" style="margin-bottom: 0;">
        <button onclick="filterBoundStudent()" style="width: 100px; margin: 0;">查詢</button>
      </div>
      <p style="font-size: 12px; color: #94a3b8; margin-top: 5px; margin-bottom: 0;">輸入帳號後即可查看該學生的成績紀錄。</p>
    </div>

    <div class="table-container">
      <table id="scores-table">
        <thead>
          <tr><th>測驗時間</th><th>姓名</th><th>身分</th><th>科目</th><th>範圍</th><th>得分</th></tr>
        </thead>
        <tbody id="scores-tbody">
          <tr><td colspan="6">資料讀取中，請稍候...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 6. 測驗進行畫面 -->
  <div class="container hidden" id="quiz-screen">
    <h2 id="quiz-title" class="title-highlight">測驗進行中</h2>
    <div style="font-size: 26px; margin: 20px 0; font-weight: bold; text-align: center; color: #fff;" id="question-text">載入中...</div>
    <input type="text" id="answer-input" placeholder="請輸入答案 (英文)" autocomplete="off" style="text-align: center; font-size: 18px;">
    <button id="submit-btn" class="btn-accent" style="height: 50px; font-size: 18px;">送出答案</button>
    <p id="feedback-text" style="text-align: center; font-size: 18px; font-weight: bold; min-height: 25px;"></p>
    <p id="sentence-hint" style="font-size: 14px; color: #cbd5e1; background: #0f172a; padding: 10px; border-radius: 8px; text-align: left;"></p>
    <div style="text-align: center; background: #0f172a; padding: 10px; border-radius: 8px; margin-top: 15px;">
      目前分數: <span id="score-display" style="color: #10b981; font-weight: bold; font-size: 24px;">0</span>
    </div>
  </div>

  <!-- 7. 測驗結果畫面 -->
  <div class="container hidden" id="result-screen">
    <h2 class="title-highlight">測驗結束！</h2>
    <div style="text-align: center; padding: 30px 0;">
      <p style="font-size: 18px; color: #94a3b8;">最終得分</p>
      <p id="final-score" style="color: var(--accent); font-weight: bold; font-size: 48px; margin: 10px 0;"></p>
    </div>
    <p id="save-status" style="text-align: center; color: #94a3b8; font-size: 14px; background: #0f172a; padding: 10px; border-radius: 8px;">正在同步成績至雲端資料庫...</p>
    <button id="result-back-btn" style="height: 50px; font-size: 18px;">回系統大廳</button>
  </div>

  <script>
    // ==========================================
    // 系統常數與資料庫設定
    // ==========================================
    const SHEET_ID = '1p9ik9A9OJ-jWoS9IbouCZ34Dns-1U7CzIqjypdEI9AE';
    const GAS_POST_URL = 'https://script.google.com/macros/s/AKfycbzNZqatn8Zf80uyUc3_mthjsNnFmhn7vYfiYUxgMm8E_iNBDINuUR0Fb6Q5631AquU/exec';
    const GOOGLE_FORM_URL = 'https://forms.gle/jDw6srx4yhvhSzN5A';

    let currentUser = { name: '', role: '', account: '' };
    let allScoresData = [];

    // ==========================================
    // 完整練習題目、單字與句子資料庫
    // ==========================================
    const quizDatabase = [
      // 國小 - 翰林版
      { stage: "國小", subject: "英文單字", edition: "翰林版", year: "115上學年度", scope: "第一次段考 (U1~U2)", word: "apple", mean: "蘋果", sentence: "I eat an apple every morning." },
      { stage: "國小", subject: "英文單字", edition: "翰林版", year: "115上學年度", scope: "第一次段考 (U1~U2)", word: "banana", mean: "香蕉", sentence: "Monkeys love to eat bananas." },
      { stage: "國小", subject: "英文單字", edition: "翰林版", year: "115上學年度", scope: "第一次段考 (U1~U2)", word: "cat", mean: "貓", sentence: "The white cat is sleeping on the chair." },
      { stage: "國小", subject: "英文單字", edition: "翰林版", year: "115上學年度", scope: "第一次段考 (U1~U2)", word: "dog", mean: "狗", sentence: "My dog likes to run around in the park." },
      
      // 國中 - 翰林版
      { stage: "國中", subject: "英文單字", edition: "翰林版", year: "115上學年度", scope: "第一次段考 (U1~U2)", word: "student", mean: "學生", sentence: "He is a hard-working student in Class 701." },
      { stage: "國中", subject: "英文單字", edition: "翰林版", year: "115上學年度", scope: "第一次段考 (U1~U2)", word: "teacher", mean: "老師", sentence: "Our English teacher is very kind and friendly." },
      { stage: "國中", subject: "英文單字", edition: "翰林版", year: "115上學年度", scope: "第一次段考 (U1~U2)", word: "classmate", mean: "同班同學", sentence: "Peter and Tom are good classmates." },
      { stage: "國中", subject: "英文單字", edition: "翰林版", year: "115上學年度", scope: "第一次段考 (U1~U2)", word: "friend", mean: "朋友", sentence: "A true friend is always there for you." },
      { stage: "國中", subject: "英文單字", edition: "翰林版", year: "115上學年度", scope: "第二次段考/期中考 (U3~U4)", word: "hungry", mean: "飢餓的", sentence: "I am very hungry; let's buy some dinner." },
      { stage: "國中", subject: "英文單字", edition: "翰林版", year: "115上學年度", scope: "第二次段考/期中考 (U3~U4)", word: "behind", mean: "在……後面", sentence: "The cat is hiding behind the door." },

      // 國中 - 康軒版
      { stage: "國中", subject: "英文單字", edition: "康軒版", year: "115上學年度", scope: "第一次段考 (U1~U2)", word: "welcome", mean: "歡迎", sentence: "Welcome to our beautiful school campus." },
      { stage: "國中", subject: "英文單字", edition: "康軒版", year: "115上學年度", scope: "第一次段考 (U1~U2)", word: "everyone", mean: "大家", sentence: "Good morning, everyone! Have a nice day." },

      // 國中 - 南一版
      { stage: "國中", subject: "英文單字", edition: "南一版", year: "115上學年度", scope: "第一次段考 (U1~U2)", word: "family", mean: "家庭", sentence: "My family enjoys camping together on weekends." },
      
      // 國中 - 文法類別
      { stage: "國中", subject: "英文文法", edition: "翰林版", year: "115上學年度", scope: "第一次段考 (U1~U2)", word: "be (am/is/are)", mean: "be動詞用法", sentence: "I am a student, and she is my teacher." },
      { stage: "國中", subject: "英文文法", edition: "翰林版", year: "115上學年度", scope: "第一次段考 (U1~U2)", word: "my/your/his", mean: "所有格代名詞", sentence: "This is my pencil, and that is your book." },

      // 高中 - 翰林版
      { stage: "高中", subject: "英文單字", edition: "翰林版", year: "115上學年度", scope: "第一次段考 (U1~U2)", word: "convenient", mean: "方便的", sentence: "Living near the MRT station is very convenient." },
      { stage: "高中", subject: "英文單字", edition: "翰林版", year: "115上學年度", scope: "第一次段考 (U1~U2)", word: "environment", mean: "環境", sentence: "We must try our best to protect the environment." }
    ];

    function showScreen(screenId) {
      document.querySelectorAll('.container').forEach(el => el.classList.add('hidden'));
      document.getElementById(screenId).classList.remove('hidden');
    }

    // 發音朗讀功能
    function speakText(text) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        speechSynthesis.speak(utterance);
      }
    }

    // ==========================================
    // 學習館核心：過濾並即時呈現單字與句子
    // ==========================================
    function openLearningPavilion() {
      showScreen('learning-pavilion-screen');
      renderLearningContent();
    }

    function renderLearningContent() {
      const stage = document.getElementById('learn-stage').value;
      const subject = document.getElementById('learn-subject').value;
      const edition = document.getElementById('learn-edition').value;
      const year = document.getElementById('learn-year').value;
      const scope = document.getElementById('learn-scope').value;

      const listContainer = document.getElementById('learning-content-list');
      listContainer.innerHTML = '';

      // 篩選符合條件的項目
      const filtered = quizDatabase.filter(item => {
        const matchStage = (stage === '全部學歷' || item.stage === stage);
        const matchSubject = (subject === '全部題目' || item.subject === subject);
        const matchEdition = (edition === '全部版本' || item.edition === edition);
        const matchScope = (scope.includes('全部') || item.scope === scope);
        return matchStage && matchSubject && matchEdition && matchScope;
      });

      if (filtered.length === 0) {
        listContainer.innerHTML = '<p style="text-align:center; color:#94a3b8; padding:20px;">尚無符合該條件的練習單字與句子。</p>';
        return;
      }

      filtered.forEach(item => {
        listContainer.innerHTML += `
          <div class="word-card">
            <div class="word-title">
              <span>${item.word}</span>
              <button class="tts-btn" onclick="speakText('${item.word}')">🔊 發音</button>
            </div>
            <div class="word-meaning">釋義：${item.mean}</div>
            <div class="word-sentence">
              💬 <b>練習例句：</b> ${item.sentence}
              <button class="tts-btn" style="margin-left:5px;" onclick="speakText('${item.sentence.replace(/'/g, "\\'")}')">🔊 朗讀例句</button>
            </div>
          </div>
        `;
      });
    }

    // ==========================================
    // GViz API 試算表讀取與登入
    // ==========================================
    async function fetchSheetData(sheetName) {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
      try {
        const response = await fetch(url);
        const text = await response.text();
        const json = JSON.parse(text.substring(47).slice(0, -2));
        return json.table.rows || [];
      } catch (error) { return []; }
    }

    function getCellValue(cell) {
      if (!cell || cell.v === null || cell.v === undefined) return '';
      return String(cell.v).trim();
    }

    document.getElementById('go-register-btn').addEventListener('click', () => window.open(GOOGLE_FORM_URL, '_blank'));

    document.getElementById('login-btn').addEventListener('click', async () => {
      const userVal = document.getElementById('login-account').value.trim();
      const passVal = document.getElementById('login-password').value.trim();
      const msg = document.getElementById('login-msg');
      
      if(!userVal || !passVal) { msg.textContent = "⚠️ 請輸入帳號與密碼"; return; }

      msg.style.color = "#38bdf8";
      msg.textContent = "連線驗證中，請稍候...";

      const [rowsMain, rowsBackup1, rowsBackup2, rowsForm1, rowsForm2] = await Promise.all([
        fetchSheetData('帳號密碼儲存庫'), fetchSheetData('預備&備用帳號'), fetchSheetData('預備_備用帳號'),
        fetchSheetData('表單回覆 1'), fetchSheetData('表單回覆_1')
      ]);

      let allUsers = [];
      [rowsMain, rowsBackup1, rowsBackup2].forEach(rows => {
        for (let i = 1; i < rows.length; i++) {
          if (!rows[i] || !rows[i].c) continue;
          allUsers.push({ name: getCellValue(rows[i].c[0]), role: getCellValue(rows[i].c[1]), account: getCellValue(rows[i].c[2]), password: getCellValue(rows[i].c[3]) });
        }
      });
      [rowsForm1, rowsForm2].forEach(rows => {
        for (let i = 1; i < rows.length; i++) {
          if (!rows[i] || !rows[i].c) continue;
          allUsers.push({ name: getCellValue(rows[i].c[1]), role: getCellValue(rows[i].c[2]), account: getCellValue(rows[i].c[3]), password: getCellValue(rows[i].c[4]) });
        }
      });

      let loggedIn = false;
      for (let user of allUsers) {
        if (user.account === userVal && user.password === passVal) { currentUser = user; loggedIn = true; break; }
      }

      if (loggedIn) {
        msg.textContent = "";
        document.getElementById('user-name-display').textContent = `身分：${currentUser.role} | 姓名：${currentUser.name}`;
        showScreen('main-menu');
      } else {
        msg.style.color = "var(--accent)";
        msg.textContent = "❌ 帳號或密碼錯誤！或者尚未註冊。";
      }
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
      currentUser = { name: '', role: '', account: '' };
      document.getElementById('login-account').value = '';
      document.getElementById('login-password').value = '';
      document.getElementById('login-msg').textContent = '';
      showScreen('login-screen');
    });

    // ==========================================
    // 成績後台權限控管
    // ==========================================
    async function loadAndShowScores() {
      showScreen('admin-screen');
      const tbody = document.getElementById('scores-tbody');
      const notice = document.getElementById('admin-notice');
      const bindSearchArea = document.getElementById('bind-search-area');
      tbody.innerHTML = '<tr><td colspan="6">資料讀取中，請稍候...</td></tr>';
      bindSearchArea.classList.add('hidden');

      const rows = await fetchSheetData('成績紀錄');
      allScoresData = [];

      for (let i = 1; i < rows.length; i++) {
        if (!rows[i].c) continue;
        allScoresData.push({
          time: getCellValue(rows[i].c[0]), name: getCellValue(rows[i].c[1]), account: getCellValue(rows[i].c[2]),
          role: getCellValue(rows[i].c[3]), subject: getCellValue(rows[i].c[5]), scope: getCellValue(rows[i].c[7]), score: getCellValue(rows[i].c[8])
        });
      }

      renderScoreTable();
    }

    function renderScoreTable(searchAccount = null) {
      const tbody = document.getElementById('scores-tbody');
      const notice = document.getElementById('admin-notice');
      const bindSearchArea = document.getElementById('bind-search-area');
      tbody.innerHTML = '';
      let displayCount = 0;

      allScoresData.forEach(data => {
        let canView = false;
        if (currentUser.role.includes('總管理員')) {
          canView = true; notice.textContent = "🟢 總管理員模式：可查看系統內所有成員的成績。";
        } else if (currentUser.role.includes('教職員') || currentUser.role.includes('人事室') || currentUser.role.includes('處室') || currentUser.role.includes('校長')) {
          if (!data.role.includes('總管理員')) canView = true; notice.textContent = "🟢 教職員模式：可查看除總管理員外之所有成員成績。";
        } else if (currentUser.role.includes('老師') || currentUser.role.includes('導師') || currentUser.role.includes('家長')) {
          bindSearchArea.classList.remove('hidden'); notice.textContent = "🟡 老師/家長模式：可查看自身成績，或於下方輸入帳號查詢綁定學生之成績。";
          if (data.account === currentUser.account) canView = true;
          if (searchAccount && data.account === searchAccount && (data.role.includes('學生') || data.role.includes('以上都沒有'))) canView = true;
        } else {
          if (data.account === currentUser.account) canView = true; notice.textContent = "⚪ 學生/一般模式：僅可查看您本人的成績紀錄。";
        }

        if (canView) {
          displayCount++;
          tbody.innerHTML += `<tr>
            <td>${data.time.split(' ')[0]}</td><td>${data.name}</td><td>${data.role.substring(0, 4)}</td>
            <td>${data.subject}</td><td><div style="max-width: 150px; overflow: hidden; text-overflow: ellipsis;" title="${data.scope}">${data.scope}</div></td>
            <td style="color:#10b981; font-weight:bold;">${data.score}</td>
          </tr>`;
        }
      });

      if (displayCount === 0) tbody.innerHTML = '<tr><td colspan="6">目前沒有可顯示的成績紀錄。</td></tr>';
    }

    function filterBoundStudent() {
      const searchVal = document.getElementById('bind-student-account').value.trim();
      if (!searchVal) { alert("請輸入學生帳號！"); return; }
      renderScoreTable(searchVal);
    }

    // ==========================================
    // 測驗機制：使用相同單字與句子資料
    // ==========================================
    let currentQuestions = [], currentQuestionIndex = 0, score = 0;

    document.getElementById('start-quiz-btn').addEventListener('click', () => {
      const stage = document.getElementById('step1-stage').value;
      const subject = document.getElementById('step4-subject').value;
      const edition = document.getElementById('step5-edition').value;
      const scope = document.getElementById('step7-scope').value;

      currentQuestions = quizDatabase.filter(item => {
        return item.stage === stage && item.subject === subject && item.edition === edition && (scope.includes('全部') || item.scope === scope);
      });

      if(currentQuestions.length === 0) {
        currentQuestions = quizDatabase.filter(item => item.stage === stage);
      }

      currentQuestions.sort(() => Math.random() - 0.5); 
      currentQuestionIndex = 0; score = 0;
      document.getElementById('score-display').textContent = score;
      showScreen('quiz-screen');
      loadQuestion();
    });

    const answerInput = document.getElementById('answer-input');
    const feedbackText = document.getElementById('feedback-text');
    const sentenceHint = document.getElementById('sentence-hint');

    function loadQuestion() {
      answerInput.value = ''; feedbackText.textContent = ''; answerInput.focus();
      const qData = currentQuestions[currentQuestionIndex];
      document.getElementById('question-text').textContent = `請輸入「${qData.mean}」的英文`;
      sentenceHint.innerHTML = `💡 <b>例句提示：</b> ${qData.sentence.replace(new RegExp(qData.word, 'gi'), '_____')}`;
    }

    document.getElementById('submit-btn').addEventListener('click', checkAnswer);
    answerInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') checkAnswer(); });

    function checkAnswer() {
      if(answerInput.value.trim() === '') return;
      const qData = currentQuestions[currentQuestionIndex];
      const userAnswer = answerInput.value.trim().toLowerCase();
      
      if (userAnswer === qData.word.toLowerCase()) {
        score += 10; document.getElementById('score-display').textContent = score;
        feedbackText.style.color = "#10b981"; feedbackText.textContent = "✅ 答對了！";
        speakText(qData.word);
      } else {
        feedbackText.style.color = "var(--accent)"; feedbackText.textContent = `❌ 答錯了！正確答案是: ${qData.word}`;
      }
      currentQuestionIndex++;
      setTimeout(() => {
        if (currentQuestionIndex < currentQuestions.length) loadQuestion();
        else endQuiz();
      }, 1200);
    }

    function endQuiz() {
      showScreen('result-screen');
      document.getElementById('final-score').textContent = score;
      const statusEl = document.getElementById('save-status');
      statusEl.style.color = "#94a3b8"; statusEl.textContent = "正在安全寫入成績至資料庫...";

      const payload = {
        name: currentUser.name, account: currentUser.account, role: currentUser.role,
        targetStage: document.getElementById('step1-stage').value,
        subject: document.getElementById('step4-subject').value,
        edition: document.getElementById('step5-edition').value,
        scope: document.getElementById('step7-scope').value, score: score
      };

      fetch(GAS_POST_URL, {
        method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
      }).then(() => {
        statusEl.style.color = "#10b981"; statusEl.textContent = "✅ 成績已成功寫入您的系統資料庫！";
      }).catch(() => {
        statusEl.style.color = "var(--accent)"; statusEl.textContent = "⚠️ 網路異常，成績傳送失敗。";
      });
    }

    document.getElementById('result-back-btn').addEventListener('click', () => showScreen('main-menu'));
  </script>
</body>
</html>
