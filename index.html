<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英文智慧選課測驗系統</title>
  <style>
    :root { --bg: #0f172a; --box: #1e293b; --primary: #3b82f6; --accent: #ef4444; --text: #f8fafc; --success: #10b981; }
    body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    .container { background: var(--box); border-radius: 15px; padding: 25px; width: 90%; max-width: 600px; margin: 20px 0; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2, h3 { text-align: center; color: white; margin-top: 0; }
    .title-highlight { color: #38bdf8; }
    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #94a3b8; font-weight: bold; }
    input, select, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; box-sizing: border-box; background: #0f172a; color: white; font-size: 16px; margin-bottom: 10px; }
    input:focus, select:focus { outline: none; border-color: var(--primary); }
    button { background: var(--primary); border: none; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; color: white; }
    button:hover { opacity: 0.9; transform: translateY(-2px); }
    .btn-secondary { background: #475569; }
    .btn-secondary:hover { background: #64748b; }
    .btn-accent { background: var(--accent); }
    .hidden { display: none !important; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; margin-bottom: 15px; }
    
    .table-container { overflow-x: auto; margin-top: 15px; border-radius: 8px; border: 1px solid #334155; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; white-space: nowrap; }
    th, td { padding: 10px; border-bottom: 1px solid #334155; text-align: center; }
    th { background: #0f172a; color: #38bdf8; position: sticky; top: 0; }
    tr:hover { background: #334155; }
    
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
    .menu-btn { height: 100px; font-size: 18px; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .menu-btn span { font-size: 24px; margin-bottom: 8px; }
  </style>
</head>
<body>

  <!-- 1. 登入畫面 -->
  <div class="container" id="login-screen">
    <h2 class="title-highlight">英文智慧選課測驗系統</h2>
    <p style="font-size: 13px; color: #94a3b8; text-align:center;">會員安全登入（支援表單即時註冊與備用庫驗證）</p>
    <div class="input-group">
      <label>帳號</label>
      <input type="text" id="login-account" placeholder="請輸入帳號">
    </div>
    <div class="input-group">
      <label>密碼</label>
      <input type="password" id="login-password" placeholder="請輸入密碼">
    </div>
    <button id="login-btn">安全登入</button>
    <button id="go-register-btn" class="btn-secondary">註冊新帳號 (前往表單)</button>
    <p id="login-msg" style="color: var(--accent); text-align: center; font-weight: bold; margin-top: 15px;"></p>
  </div>

  <!-- 2. 主選單大廳 -->
  <div class="container hidden" id="main-menu">
    <div class="header">
      <div>
        <h3 style="margin:0; text-align: left;" class="title-highlight">系統大廳</h3>
        <span id="user-name-display" style="color: #94a3b8; font-size: 14px;"></span>
      </div>
      <button id="logout-btn" style="width: auto; padding: 6px 15px;" class="btn-secondary">登出</button>
    </div>

    <div class="menu-grid">
      <button class="menu-btn" onclick="showScreen('quiz-setup-screen')"><span>📝</span>智慧選課測驗</button>
      <button class="menu-btn" style="background: #8b5cf6;" onclick="showScreen('learning-pavilion-screen')"><span>📚</span>學習館</button>
      <button class="menu-btn" style="background: #10b981; grid-column: span 2;" onclick="loadAndShowScores()"><span>📊</span>成績紀錄與後台</button>
    </div>
  </div>

  <!-- 3. 智慧選課測驗設定 -->
  <div class="container hidden" id="quiz-setup-screen">
    <div class="header">
      <h3 style="margin:0;" class="title-highlight">智慧選課與範圍設定</h3>
      <button onclick="showScreen('main-menu')" style="width: auto; padding: 5px 15px;" class="btn-secondary">返回</button>
    </div>
    <div id="selection-area">
      <div class="input-group"><label>Step 1: 個人學歷</label><select id="step1-stage"><option value="國小">國小</option><option value="國中" selected>國中</option><option value="高中">
