<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英文智慧測驗系統</title>
  <style>
    body {
      margin: 0; padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
    }
    .glass-container {
      background: rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 40px; width: 90%; max-width: 600px;
      text-align: center; color: #333; margin: 20px 0;
    }
    input, select, button {
      width: 100%; padding: 12px; margin: 10px 0;
      border-radius: 10px; border: none; outline: none; font-size: 16px;
      box-sizing: border-box;
    }
    input, select { background: rgba(255, 255, 255, 0.7); }
    button { background: #4facfe; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
    button:hover { background: #00f2fe; }
    .btn-secondary { background: #a18cd1; }
    .btn-secondary:hover { background: #fbc2eb; }
    .btn-danger { background: #ff758c; }
    .btn-danger:hover { background: #ff7eb3; }
    .hidden { display: none !important; }
    
    .admin-table { width: 100%; border-collapse: collapse; margin-top: 15px; background: rgba(255,255,255,0.5); border-radius: 10px; overflow: hidden; }
    .admin-table th, .admin-table td { padding: 10px; border-bottom: 1px solid rgba(0,0,0,0.1); font-size: 14px;}
    .admin-table input, .admin-table select, .admin-table button { padding: 5px; margin: 0; font-size: 14px;}
    .header-nav { display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

  <!-- 1. 登入畫面 -->
  <div class="glass-container" id="login-screen">
    <h2>系統登入</h2>
    <input type="text" id="login-username" placeholder="請輸入帳號">
    <input type="password" id="login-password" placeholder="請輸入密碼">
    <button id="login-btn">登入</button>
    <button id="go-register-btn" class="btn-secondary">註冊新帳號</button>
    <p id="login-msg" style="color: red;"></p>
  </div>

  <!-- 1.5 註冊畫面 -->
  <div class="glass-container hidden" id="register-screen">
    <h2>註冊新帳號</h2>
    <input type="text" id="reg-username" placeholder="請設定帳號">
    <input type="password" id="reg-password" placeholder="請設定密碼">
    <input type="password" id="reg-password-confirm" placeholder="請再次輸入密碼">
    <button id="register-btn">送出註冊</button>
    <button id="reg-back-btn" class="btn-danger">返回登入</button>
    <p id="reg-msg" style="color: red;"></p>
  </div>

  <!-- 2. 主選單 -->
  <div class="glass-container hidden" id="main-menu">
    <div class="header-nav">
      <h3 id="welcome-text">歡迎</h3>
      <button id="logout-btn" style="width: auto; padding: 5px 15px;" class="btn-danger">登出</button>
    </div>
    <hr>
    <button id="go-quiz-btn">進入測驗系統</button>
    <button id="go-admin-btn" class="hidden">進入管理員後台</button> 
  </div>

  <!-- 3. 管理員後台 -->
  <div class="glass-container hidden" id="admin-screen" style="max-width: 800px;">
    <div class="header-nav">
      <h2>系統後台</h2>
      <button id="admin-back-btn" style="width: auto; padding: 5px 15px;">返回主選單</button>
    </div>
    
    <h3>學生測驗成績</h3>
    <button id="refresh-scores-btn">重新載入成績</button>
    <table class="admin-table">
      <thead><tr><th>帳號</th><th>身分</th><th>範圍</th><th>分數</th></tr></thead>
      <tbody id="scores-tbody"></tbody>
    </table>

    <div id="user-management-section" class="hidden">
      <hr>
      <h3>帳號權限與密碼管理 (總管理員專屬)</h3>
      <button id="refresh-users-btn">載入使用者名單</button>

        <thead><tr><th>帳號</th><th>新密碼</th><th>身分</th><th>操作</th></tr></thead>
        <tbody id="users-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- 4. 測驗設定畫面 -->
  <div class="glass-container hidden" id="setup-screen">
    <div class="header-nav">
      <h2>選擇測驗範圍</h2>
      <button id="quiz-back-btn" style="width: auto; padding: 5px 15px;">返回</button>
    </div>
    <select id="stage-select"></select>
    <select id="edition-select"></select>
    <select id="grade-select"></select>
    <select id="scope-select"></select>
    <button id="start-btn">開始測驗</button>
  </div>

  <!-- 5. 測驗進行畫面 -->
  <div class="glass-container hidden" id="quiz-screen">

    <div style="font-size: 24px; margin: 20px 0; font-weight: bold;" id="question-text">載入中...</div>
    <input type="text" id="answer-input" placeholder="請輸入答案 (英文)" autocomplete="off">
    <button id="submit-btn">送出答案</button>
    <p id="feedback-text"></p>
    <p>目前分數: <span id="score-display">0</span></p>
  </div>

            ],
            "第二次段考/期中考 (U3~U4)": [
              {q:"經常", a:"often", t:"v"},{q:"有時", a:"sometimes", t:"v"},{q:"醫院", a:"hospital", t:"v"},{q:"醫生", a:"doctor", t:"v"},{q:"吃藥", a:"take medicine", t:"v"},
              {q:"How _______ do you visit your grandparents in Tainan?", a:"often", t:"g"}
            ],
            "第二次段考/期末考 (U5~U6)": [
              {q:"菜單", a:"menu", t:"v"},{q:"牛肉", a:"beef", t:"v"},{q:"豬肉", a:"pork", t:"v"},{q:"停止", a:"stop", t:"v"},{q:"等待", a:"wait", t:"v"},
              {q:"How much _______ the beef noodles at this restaurant?", a:"are", t:"g"}
            ]
          },
          "九年級": {
            "第一次段考 (U1~U2)": [
              {q:"完成", a:"have done", t:"v"},{q:"看過", a:"has seen", t:"v"},{q:"已經", a:"already", t:"v"},{q:"足夠", a:"enough", t:"v"},{q:"非常", a:"very", t:"v"},
              {q:"Has she ever _______ a horse before?", a:"ridden", t:"g"}
            ],
            "第二次段考/期中考 (U3~U4)": [
              {q:"誰(關代)", a:"who", t:"v"},{q:"哪一個(關代)", a:"which", t:"v"},{q:"友誼", a:"friendship", t:"v"},{q:"地球", a:"earth", t:"v"},{q:"回收", a:"recycle", t:"v"},
              {q:"The man _______ is talking to our principal is my dad. (關代：人)", a:"who", t:"g"}
            ],
            "第二次段考/期末考 (U5~U6)": [
              {q:"然而", a:"however", t:"v"},{q:"因為", a:"because", t:"v"},{q:"節日", a:"holiday", t:"v"},{q:"禮物", a:"gift", t:"v"},{q:"祝福/願望", a:"wish", t:"v"},
              {q:"She is very good _______ solving complex math problems.", a:"at", t:"g"}
            ]
          }
        }
      }
    };

    // ==========================================
    // UI 與連動選單邏輯
    // ==========================================
    function showScreen(screenId) {
      document.querySelectorAll('.glass-container').forEach(el => el.classList.add('hidden'));
      document.getElementById(screenId).classList.remove('hidden');
    }

    const stageSel = document.getElementById('stage-select');
    const editionSel = document.getElementById('edition-select');
    const gradeSel = document.getElementById('grade-select');
    const scopeSel = document.getElementById('scope-select');

    function populateSelect(selectEl, optionsObj) {
      selectEl.innerHTML = '';
      Object.keys(optionsObj).forEach(key => {
        const opt = document.createElement('option');
        opt.value = key; opt.textContent = key;
        selectEl.appendChild(opt);
      });
    }

    stageSel.addEventListener('change', () => {
      populateSelect(editionSel, quizData[stageSel.value]);
      editionSel.dispatchEvent(new Event('change'));
    });
    editionSel.addEventListener('change', () => {
      populateSelect(gradeSel, quizData[stageSel.value][editionSel.value]);
      gradeSel.dispatchEvent(new Event('change'));
    });
    gradeSel.addEventListener('change', () => {
      populateSelect(scopeSel, quizData[stageSel.value][editionSel.value][gradeSel.value]);
    });

    populateSelect(stageSel, quizData);
    stageSel.dispatchEvent(new Event('change'));

    // ==========================================
    // 註冊系統邏輯
    // ==========================================
    document.getElementById('go-register-btn').addEventListener('click', () => {
      document.getElementById('reg-username').value = '';
      document.getElementById('reg-password').value = '';
      document.getElementById('reg-password-confirm').value = '';
      document.getElementById('reg-msg').textContent = '';
      showScreen('register-screen');
    });

    document.getElementById('reg-back-btn').addEventListener('click', () => showScreen('login-screen'));

    document.getElementById('register-btn').addEventListener('click', async () => {
      const userVal = document.getElementById('reg-username').value.trim();
      const passVal = document.getElementById('reg-password').value.trim();
      const passConfirm = document.getElementById('reg-password-confirm').value.trim();
      const msg = document.getElementById('reg-msg');

      if (!userVal || !passVal) { msg.textContent = "帳號與密碼不能為空！"; return; }
      if (passVal !== passConfirm) { msg.textContent = "兩次密碼輸入不一致！"; return; }

      msg.style.color = "blue"; msg.textContent = "正在檢查帳號並寫入資料庫...";

      try {
        const q = query(collection(db, "users"), where("username", "==", userVal));
        const querySnapshot = await getDocs(q);

        if (!querySnapshot.empty) {
          msg.style.color = "red"; msg.textContent = "此帳號已被註冊，請換一個名稱。";
          return;
        }

        await addDoc(collection(db, "users"), {
          username: userVal,
          password: passVal,
          role: "student" // 註冊者預設為學生
        });

        alert("註冊成功！請使用新帳號登入。");
        showScreen('login-screen');
      } catch (e) {
        msg.style.color = "red"; msg.textContent = "註冊失敗，請確認資料庫權限設定：" + e.message;
      }
    });

    // ==========================================
    // 登入系統邏輯
    // ==========================================
    document.getElementById('login-btn').addEventListener('click', async () => {
      const userVal = document.getElementById('login-username').value.trim();
      const passVal = document.getElementById('login-password').value.trim();
      const msg = document.getElementById('login-msg');
      msg.textContent = "連線登入中...";

      try {
        const q = query(collection(db, "users"), where("username", "==", userVal));
        const querySnapshot = await getDocs(q);
        
        if (querySnapshot.empty) {
          msg.textContent = "找不到此帳號，請先註冊。"; return;
        }

        let loggedIn = false;
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          if (data.password === passVal) {
            currentUser = { username: data.username, role: data.role, docId: doc.id };
            loggedIn = true;
          }
        });

        if (loggedIn) {
          document.getElementById('welcome-text').textContent = `歡迎, ${currentUser.username} (${currentUser.role})`;
          
          // 若為管理員或教職員，顯示後台按鈕
          if (currentUser.role === 'superadmin' || currentUser.role === 'staff') {
            document.getElementById('go-admin-btn').classList.remove('hidden');
          }
          // 若為總管理員，顯示帳號管理區
          if (currentUser.role === 'superadmin') {
            document.getElementById('user-management-section').classList.remove('hidden');
          }
          
          showScreen('main-menu');
        } else { msg.textContent = "密碼錯誤！"; }
      } catch (e) { msg.textContent = "連線發生錯誤，請確認網路與資料庫設定。"; }
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
      currentUser = { username: '', role: '' };
      document.getElementById('login-username').value = '';
      document.getElementById('login-password').value = '';
      document.getElementById('login-msg').textContent = '';
      document.getElementById('go-admin-btn').classList.add('hidden');
      document.getElementById('user-management-section').classList.add('hidden');
      showScreen('login-screen');
    });

    // ==========================================
    // 後台管理系統邏輯 (成績檢視與帳號管理)
    // ==========================================
    document.getElementById('go-admin-btn').addEventListener('click', () => showScreen('admin-screen'));
    document.getElementById('admin-back-btn').addEventListener('click', () => showScreen('main-menu'));

    // 載入成績按鈕
    document.getElementById('refresh-scores-btn').addEventListener('click', async () => {
      const tbody = document.getElementById('scores-tbody');
      tbody.innerHTML = '<tr><td colspan="4">載入中...</td></tr>';
      try {
        const querySnapshot = await getDocs(collection(db, "quiz_records"));
        tbody.innerHTML = '';
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          // 【權限核心邏輯】: 如果登入者是教職員(staff)，則隱藏身分為(superadmin)的成績
          if (currentUser.role === 'staff' && data.user_role === 'superadmin') return; 
          
          tbody.innerHTML += `<tr><td>${data.username}</td><td>${data.user_role}</td><td>${data.test_scope}</td><td>${data.final_score}</td></tr>`;
        });
      } catch (e) { tbody.innerHTML = '<tr><td colspan="4">載入失敗</td></tr>'; }
    });

    // 載入使用者名單按鈕 (僅總管理員可見)
    document.getElementById('refresh-users-btn').addEventListener('click', async () => {
      const tbody = document.getElementById('users-tbody');
      tbody.innerHTML = '<tr><td colspan="4">載入中...</td></tr>';
      try {
        const querySnapshot = await getDocs(collection(db, "users"));
        tbody.innerHTML = '';
        querySnapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const roleOptions = `
            <option value="student" ${data.role === 'student' ? 'selected' : ''}>學生 (student)</option>
            <option value="staff" ${data.role === 'staff' ? 'selected' : ''}>教職員 (staff)</option>
            <option value="superadmin" ${data.role === 'superadmin' ? 'selected' : ''}>總管理員 (superadmin)</option>
          `;
          tbody.innerHTML += `<tr>
            <td>${data.username}</td>
            <td><input type="text" id="pw-${docSnap.id}" value="${data.password}"></td>
            <td><select id="role-${docSnap.id}">${roleOptions}</select></td>
            <td><button onclick="window.updateUser('${docSnap.id}')">儲存變更</button></td>
          </tr>`;
        });
      } catch (e) { tbody.innerHTML = '<tr><td colspan="4">載入失敗</td></tr>'; }
    });

    // 更新使用者密碼與身分 (掛載到 window 供按鈕點擊)
    window.updateUser = async (docId) => {
      const newPw = document.getElementById(`pw-${docId}`).value;
      const newRole = document.getElementById(`role-${docId}`).value;
      try {
        await updateDoc(doc(db, "users", docId), { password: newPw, role: newRole });
        alert("資料更新成功！");
      } catch (e) { alert("更新失敗"); }
    };

    // ==========================================
    // 測驗系統核心邏輯
    // ==========================================
    let currentQuestions = [], currentQuestionIndex = 0, score = 0;
    document.getElementById('go-quiz-btn').addEventListener('click', () => showScreen('setup-screen'));
    document.getElementById('quiz-back-btn').addEventListener('click', () => showScreen('main-menu'));
    document.getElementById('result-back-btn').addEventListener('click', () => showScreen('main-menu'));

    document.getElementById('start-btn').addEventListener('click', () => {
      const stg = stageSel.value, edt = editionSel.value, grd = gradeSel.value, scp = scopeSel.value;
      if (quizData[stg] && quizData[stg][edt] && quizData[stg][edt][grd] && quizData[stg][edt][grd][scp]) {
        currentQuestions = [...quizData[stg][edt][grd][scp]];
        currentQuestions.sort(() => Math.random() - 0.5); 
        currentQuestionIndex = 0; score = 0;
        document.getElementById('score-display').textContent = score;
        showScreen('quiz-screen');
        loadQuestion();
      } else { alert("錯誤：無法讀取此範圍題庫。"); }
    });

    const answerInput = document.getElementById('answer-input');
    const feedbackText = document.getElementById('feedback-text');

    function loadQuestion() {
      answerInput.value = ''; feedbackText.textContent = ''; answerInput.focus();
      const qData = currentQuestions[currentQuestionIndex];
      document.getElementById('question-text').textContent = qData.t === 'v' ? `請輸入「${qData.q}」的英文單字` : qData.q;
    }

    document.getElementById('submit-btn').addEventListener('click', checkAnswer);
    answerInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') checkAnswer(); });

    function checkAnswer() {
      if(answerInput.value.trim() === '') return;
      const qData = currentQuestions[currentQuestionIndex];
      const userAnswer = answerInput.value.trim().toLowerCase();
      
      if (userAnswer === qData.a.toLowerCase()) {
        score += 10; document.getElementById('score-display').textContent = score;
        feedbackText.style.color = "green"; feedbackText.textContent = "答對了！";
      } else {
        feedbackText.style.color = "red"; feedbackText.textContent = `答錯了！正確答案是: ${qData.a}`;
      }
      currentQuestionIndex++;
      setTimeout(() => {
        if (currentQuestionIndex < currentQuestions.length) loadQuestion();
        else endQuiz();
      }, 1200);
    }

    async function endQuiz() {
      showScreen('result-screen');
      document.getElementById('final-score').textContent = score;
      try {
        await addDoc(collection(db, "quiz_records"), {
          username: currentUser.username,
          user_role: currentUser.role,
          test_scope: `${stageSel.value}-${editionSel.value}-${gradeSel.value}-${scopeSel.value}`,
          final_score: score,
          timestamp: serverTimestamp()
        });
        document.getElementById('save-status').textContent = "✅ 成績已成功儲存至雲端資料庫！";
      } catch (e) { document.getElementById('save-status').textContent = "❌ 成績儲存失敗。"; }
    }
  </script>
</body>
</html>
