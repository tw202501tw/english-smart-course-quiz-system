<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英文智慧選課測驗與拼字練習系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              500: '#06b6d4',
              600: '#0891b2',
              900: '#0e7490',
            },
            glass: 'rgba(30, 41, 59, 0.75)',
            glassBorder: 'rgba(255, 255, 255, 0.12)'
          }
        }
      }
    }
  </script>
  <style>
    body {
      background: radial-gradient(circle at top left, #0f172a, #1e1b4b, #090d16);
      min-height: 100vh;
      color: #f8fafc;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .glass-input {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f8fafc;
      transition: all 0.3s ease;
    }
    .glass-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
      outline: none;
    }
    .btn-gradient {
      background: linear-gradient(135deg, #38bdf8 0%, #3b82f6 100%);
      transition: all 0.3s ease;
    }
    .btn-gradient:hover {
      opacity: 0.95;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.4);
    }
    .btn-purple {
      background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
    }
    .btn-purple:hover {
      box-shadow: 0 8px 20px rgba(168, 85, 247, 0.4);
    }
    .btn-emerald {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    }
    .btn-emerald:hover {
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="p-3 sm:p-6 flex flex-col items-center justify-center relative min-h-screen">

  <!-- Toast Notification Modal -->
  <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 hidden transition-all duration-300">
    <div id="toast-body" class="px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3 text-sm font-semibold border backdrop-blur-md">
      <i id="toast-icon" class="fa-solid fa-circle-info text-lg"></i>
      <span id="toast-msg">提示訊息</span>
    </div>
  </div>

  <!-- Main Application Container -->
  <main class="w-full max-w-3xl">

    <!-- 1. 登入畫面 (Login Screen) -->
    <section id="screen-login" class="glass-card rounded-2xl p-6 sm:p-10 text-center animate-fade-in">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-cyan-500/20 text-cyan-400 mb-4 border border-cyan-500/30">
        <i class="fa-solid fa-graduation-cap text-3xl"></i>
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-sky-300 to-indigo-400 mb-2">
        英文智慧選課測驗與拼字系統
      </h1>
      <p class="text-xs sm:text-sm text-slate-400 mb-6">雙重雲端驗證 · 極速自動同步 · 智慧多級題庫</p>

      <div class="space-y-4 text-left max-w-md mx-auto">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">帳號</label>
          <input type="text" id="login-account" class="w-full glass-input rounded-xl px-4 py-3 text-sm" placeholder="請輸入登入帳號">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">密碼</label>
          <input type="password" id="login-password" class="w-full glass-input rounded-xl px-4 py-3 text-sm" placeholder="請輸入登入密碼">
        </div>
        <button id="btn-login" class="w-full btn-gradient py-3.5 rounded-xl font-bold text-white text-base shadow-lg mt-2 flex items-center justify-center gap-2">
          <i class="fa-solid fa-right-to-bracket"></i> 安全登入
        </button>
        <button onclick="openRegisterModal()" class="w-full bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700 py-3 rounded-xl font-semibold text-sm transition">
          <i class="fa-solid fa-user-plus text-cyan-400 mr-1"></i> 快速註冊新帳號 (1秒完工)
        </button>
      </div>
    </section>

    <!-- 快速註冊 Modal (Register Modal) -->
    <div id="modal-register" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4">
      <div class="glass-card rounded-2xl p-6 sm:p-8 w-full max-w-md text-left relative border border-slate-700 shadow-2xl">
        <button onclick="closeRegisterModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <h2 class="text-xl font-bold text-cyan-400 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-id-card"></i> 新會員極速註冊
        </h2>
        <div class="space-y-3">
          <div>
            <label class="block text-xs text-slate-300 mb-1">真實姓名</label>
            <input type="text" id="reg-name" class="w-full glass-input rounded-lg px-3 py-2 text-sm" placeholder="例：王小明">
          </div>
          <div>
            <label class="block text-xs text-slate-300 mb-1">身分類別</label>
            <select id="reg-role" class="w-full glass-input rounded-lg px-3 py-2 text-sm">
              <option value="1.教職員/人事室/處室/校長">1.教職員/人事室/處室/校長</option>
              <option value="2.老師/導師">2.老師/導師</option>
              <option value="3.家長">3.家長</option>
              <option value="4.學生" selected>4.學生</option>
              <option value="5.以上都沒有符合我的條件">5.以上都沒有符合我的條件</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-300 mb-1">設定帳號</label>
            <input type="text" id="reg-account" class="w-full glass-input rounded-lg px-3 py-2 text-sm" placeholder="請自訂帳號">
          </div>
          <div>
            <label class="block text-xs text-slate-300 mb-1">設定密碼</label>
            <input type="password" id="reg-password" class="w-full glass-input rounded-lg px-3 py-2 text-sm" placeholder="請自訂密碼">
          </div>
          <button id="btn-submit-reg" class="w-full btn-emerald py-3 rounded-xl font-bold text-white text-sm shadow-md mt-4">
            <i class="fa-solid fa-bolt mr-1"></i> 完成註冊並自動登入
          </button>
        </div>
      </div>
    </div>

    <!-- 2. 系統大廳 (Main Menu Screen) -->
    <section id="screen-main-menu" class="glass-card rounded-2xl p-6 sm:p-8 hidden">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-700/80 pb-4 mb-6 gap-3">
        <div>
          <span class="text-xs font-semibold px-2.5 py-1 rounded-md bg-cyan-500/20 text-cyan-300 border border-cyan-500/30" id="user-role-badge">身分</span>
          <h2 class="text-xl font-bold text-white mt-1" id="user-name-display">使用者姓名</h2>
        </div>
        <button onclick="logout()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 rounded-lg text-xs font-semibold transition">
          <i class="fa-solid fa-right-from-bracket mr-1"></i> 登出系統
        </button>
      </div>

      <!-- 四大模組 Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- 模組 1: 智慧選課測驗 -->
        <button onclick="openQuizSetup()" class="p-6 rounded-2xl bg-slate-800/60 hover:bg-slate-800 border border-slate-700 text-left transition group relative overflow-hidden">
          <div class="w-12 h-12 rounded-xl bg-cyan-500/20 text-cyan-400 flex items-center justify-center text-2xl mb-3 group-hover:scale-110 transition">
            <i class="fa-solid fa-list-check"></i>
          </div>
          <h3 class="text-lg font-bold text-white group-hover:text-cyan-300 transition">智慧選課測驗</h3>
          <p class="text-xs text-slate-400 mt-1">依學歷、版本、學年度與段考範圍精準測驗單字與文法。</p>
        </button>

        <!-- 模組 2: 拼字練習館 -->
        <button onclick="openSpellingSetup()" class="p-6 rounded-2xl bg-slate-800/60 hover:bg-slate-800 border border-purple-500/30 text-left transition group relative overflow-hidden">
          <div class="w-12 h-12 rounded-xl bg-purple-500/20 text-purple-400 flex items-center justify-center text-2xl mb-3 group-hover:scale-110 transition">
            <i class="fa-solid fa-keyboard"></i>
          </div>
          <h3 class="text-lg font-bold text-white group-hover:text-purple-300 transition">拼字練習館</h3>
          <p class="text-xs text-slate-400 mt-1">例句缺字提示、即時拼寫檢測與 TTS 真人發音練習。</p>
        </button>

        <!-- 模組 3: 學習館卡片 -->
        <button onclick="openLearningPavilion()" class="p-6 rounded-2xl bg-slate-800/60 hover:bg-slate-800 border border-indigo-500/30 text-left transition group relative overflow-hidden">
          <div class="w-12 h-12 rounded-xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-2xl mb-3 group-hover:scale-110 transition">
            <i class="fa-solid fa-book-open-reader"></i>
          </div>
          <h3 class="text-lg font-bold text-white group-hover:text-indigo-300 transition">學習館 (單字與例句)</h3>
          <p class="text-xs text-slate-400 mt-1">瀏覽條件下所有單字釋義、例句卡片與語音朗讀。</p>
        </button>

        <!-- 模組 4: 成績與權限後台 -->
        <button onclick="loadAndShowScores()" class="p-6 rounded-2xl bg-slate-800/60 hover:bg-slate-800 border border-emerald-500/30 text-left transition group relative overflow-hidden">
          <div class="w-12 h-12 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-2xl mb-3 group-hover:scale-110 transition">
            <i class="fa-solid fa-chart-line"></i>
          </div>
          <h3 class="text-lg font-bold text-white group-hover:text-emerald-300 transition">成績紀錄與後台</h3>
          <p class="text-xs text-slate-400 mt-1">依身分權限檢視個人、全校或綁定學生的測驗成績。</p>
        </button>
      </div>
    </section>

    <!-- 3. 智慧選課測驗設定畫面 (Quiz Setup Screen) -->
    <section id="screen-quiz-setup" class="glass-card rounded-2xl p-6 sm:p-8 hidden">
      <div class="flex justify-between items-center border-b border-slate-700/80 pb-4 mb-6">
        <h2 class="text-xl font-bold text-cyan-400 flex items-center gap-2">
          <i class="fa-solid fa-sliders"></i> 智慧選課與測驗範圍設定
        </h2>
        <button onclick="showScreen('screen-main-menu')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs">
          <i class="fa-solid fa-arrow-left"></i> 返回大廳
        </button>
      </div>

      <div class="space-y-4 text-left">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">Step 1: 個人/目標學歷</label>
            <select id="q-stage" class="w-full glass-input rounded-xl px-3 py-2.5 text-sm" onchange="updateSubOptions('q')">
              <option value="國小">國小</option>
              <option value="國中" selected>國中</option>
              <option value="高中">高中</option>
              <option value="大學">大學</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">Step 2: 年級 / 模組</label>
            <select id="q-grade" class="w-full glass-input rounded-xl px-3 py-2.5 text-sm"></select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">Step 3: 測驗科目</label>
            <select id="q-subject" class="w-full glass-input rounded-xl px-3 py-2.5 text-sm">
              <option value="英文單字">英文單字</option>
              <option value="英文文法">英文文法</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">Step 4: 版本選擇</label>
            <select id="q-edition" class="w-full glass-input rounded-xl px-3 py-2.5 text-sm"></select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">Step 5: 學年度</label>
            <select id="q-year" class="w-full glass-input rounded-xl px-3 py-2.5 text-sm">
              <option value="115上學年度">115上學年度</option>
              <option value="115下學年度">115下學年度</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">Step 6: 課程/段考範圍</label>
            <select id="q-scope" class="w-full glass-input rounded-xl px-3 py-2.5 text-sm">
              <option value="第一次段考 (U1~U2)">第一次段考 (U1~U2)</option>
              <option value="第二次段考/期中考 (U3~U4)">第二次段考/期中考 (U3~U4)</option>
              <option value="期末考 (U5~U6)">期末考 (U5~U6)</option>
              <option value="全部題目">全部範圍/題目</option>
            </select>
          </div>
        </div>

        <!-- 題數模式選擇 (Question Count Selector) -->
        <div class="pt-2">
          <label class="block text-xs font-bold text-cyan-300 mb-2">Step 7: 選擇測驗題數模式</label>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2" id="q-count-btns">
            <button type="button" onclick="selectQCount(10, this)" class="q-count-btn py-2.5 rounded-xl border border-slate-700 bg-slate-800 text-slate-200 text-xs font-bold hover:border-cyan-500 transition border-cyan-500 bg-cyan-500/20 text-cyan-300">10 題</button>
            <button type="button" onclick="selectQCount(20, this)" class="q-count-btn py-2.5 rounded-xl border border-slate-700 bg-slate-800 text-slate-200 text-xs font-bold hover:border-cyan-500 transition">20 題</button>
            <button type="button" onclick="selectQCount('ALL', this)" class="q-count-btn py-2.5 rounded-xl border border-slate-700 bg-slate-800 text-slate-200 text-xs font-bold hover:border-cyan-500 transition">全部題目</button>
            <button type="button" onclick="selectQCount('CUSTOM', this)" class="q-count-btn py-2.5 rounded-xl border border-slate-700 bg-slate-800 text-slate-200 text-xs font-bold hover:border-cyan-500 transition">自選題數</button>
          </div>
          <div id="custom-count-box" class="mt-3 hidden">
            <input type="number" id="q-custom-num" min="1" max="100" class="w-full glass-input rounded-xl px-3 py-2 text-sm text-center" placeholder="請輸入自訂題數 (例: 15)">
          </div>
        </div>

        <button onclick="startQuiz()" class="w-full btn-gradient py-3.5 rounded-xl font-bold text-white text-base shadow-xl mt-4">
          <i class="fa-solid fa-play mr-1"></i> 開始測驗
        </button>
      </div>
    </section>

    <!-- 4. 拼字練習館設定畫面 (Spelling Setup Screen) -->
    <section id="screen-spelling-setup" class="glass-card rounded-2xl p-6 sm:p-8 hidden">
      <div class="flex justify-between items-center border-b border-slate-700/80 pb-4 mb-6">
        <h2 class="text-xl font-bold text-purple-400 flex items-center gap-2">
          <i class="fa-solid fa-spell-check"></i> 拼字練習館設定
        </h2>
        <button onclick="showScreen('screen-main-menu')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs">
          <i class="fa-solid fa-arrow-left"></i> 返回大廳
        </button>
      </div>

      <div class="space-y-4 text-left">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">目標學歷</label>
            <select id="s-stage" class="w-full glass-input rounded-xl px-3 py-2.5 text-sm" onchange="updateSubOptions('s')">
              <option value="國小">國小</option>
              <option value="國中" selected>國中</option>
              <option value="高中">高中</option>
              <option value="大學">大學</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">年級 / 模組</label>
            <select id="s-grade" class="w-full glass-input rounded-xl px-3 py-2.5 text-sm"></select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">版本</label>
            <select id="s-edition" class="w-full glass-input rounded-xl px-3 py-2.5 text-sm"></select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">範圍</label>
            <select id="s-scope" class="w-full glass-input rounded-xl px-3 py-2.5 text-sm">
              <option value="第一次段考 (U1~U2)">第一次段考 (U1~U2)</option>
              <option value="第二次段考/期中考 (U3~U4)">第二次段考/期中考 (U3~U4)</option>
              <option value="全部題目">全部範圍</option>
            </select>
          </div>
        </div>

        <button onclick="startSpelling()" class="w-full btn-purple py-3.5 rounded-xl font-bold text-white text-base shadow-xl mt-4">
          <i class="fa-solid fa-font mr-1"></i> 開始拼字練習
        </button>
      </div>
    </section>

    <!-- 5. 測驗進行畫面 (Quiz Playing Screen) -->
    <section id="screen-quiz-play" class="glass-card rounded-2xl p-6 sm:p-8 hidden text-center">
      <div class="flex justify-between items-center mb-4 text-xs font-semibold text-slate-400">
        <span id="quiz-progress-text">題目 1 / 10</span>
        <span class="text-emerald-400">得分: <span id="quiz-score-num" class="text-base font-bold">0</span></span>
      </div>

      <!-- Progress Bar -->
      <div class="w-full bg-slate-800 rounded-full h-2 mb-6 overflow-hidden">
        <div id="quiz-progress-bar" class="bg-cyan-400 h-2 rounded-full transition-all duration-300" style="width: 10%"></div>
      </div>

      <div class="py-4">
        <span class="text-xs px-2.5 py-1 rounded bg-slate-800 text-cyan-300 border border-slate-700" id="quiz-q-type">中文翻譯題</span>
        <h3 class="text-xl sm:text-2xl font-bold text-white mt-3 mb-2" id="quiz-q-title">請輸入「蘋果」的英文</h3>
        <p id="quiz-q-sentence" class="text-sm text-slate-300 bg-slate-900/60 p-3 rounded-xl border border-slate-800 text-left my-4 hidden"></p>
      </div>

      <div class="max-w-md mx-auto space-y-3">
        <input type="text" id="quiz-answer-input" class="w-full glass-input rounded-xl px-4 py-3 text-center text-lg font-bold tracking-wide" placeholder="請輸入英文答案" autocomplete="off">
        <button id="btn-quiz-submit" class="w-full btn-gradient py-3 rounded-xl font-bold text-white text-base">
          送出答案
        </button>
      </div>

      <p id="quiz-feedback" class="text-sm font-bold mt-4 min-h-[24px]"></p>
    </section>

    <!-- 6. 拼字練習進行畫面 (Spelling Play Screen) -->
    <section id="screen-spelling-play" class="glass-card rounded-2xl p-6 sm:p-8 hidden text-center">
      <div class="flex justify-between items-center mb-4 text-xs font-semibold text-slate-400">
        <span id="spell-progress-text">進度 1 / 10</span>
        <span class="text-purple-400">拼字正確率: <span id="spell-score-num" class="text-base font-bold">0</span>%</span>
      </div>

      <div class="py-2">
        <div class="inline-flex items-center gap-2 mb-2">
          <span class="text-2xl sm:text-3xl font-extrabold text-purple-300" id="spell-word-mean">蘋果</span>
          <button onclick="playCurrentWordTTS()" class="w-8 h-8 rounded-full bg-purple-500/20 text-purple-300 hover:bg-purple-500/40 flex items-center justify-center transition">
            <i class="fa-solid fa-volume-high text-xs"></i>
          </button>
        </div>
        <div class="text-sm text-slate-300 bg-slate-900/80 p-4 rounded-xl border border-purple-500/20 text-left my-3" id="spell-sentence-box">

      const toast = document.getElementById('toast');
      const toastBody = document.getElementById('toast-body');

    // ==========================================
    // 3. 雙資料庫連動與極速註冊登入
    // ==========================================
    async function fetchSheetData(sheetName) {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
      try {
        const response = await fetch(url);
        const text = await response.text();
        const json = JSON.parse(text.substring(47).slice(0, -2));
        return json.table.rows || [];
      } catch (err) {
        return [];
      }
    }

    function getCellValue(cell) {
      if (!cell || cell.v === null || cell.v === undefined) return '';
      return String(cell.v).trim();
    }

    // 登入按鈕處置
    document.getElementById('btn-login').addEventListener('click', async () => {
      const userVal = document.getElementById('login-account').value.trim();
      const passVal = document.getElementById('login-password').value.trim();

      if (!userVal || !passVal) { showToast("請填寫帳號與密碼", "error"); return; }

      showToast("正在驗證身分，請稍候...", "info");

      // 讀取試算表中的帳號資料
      const [rowsMain, rowsBackup, rowsForm] = await Promise.all([
        fetchSheetData('帳號密碼儲存庫'),
        fetchSheetData('預備&備用帳號'),
        fetchSheetData('表單回覆 1')
      ]);

      let allUsers = [];

      [rowsMain, rowsBackup].forEach(rows => {
        for (let i = 1; i < rows.length; i++) {
          if (!rows[i] || !rows[i].c) continue;
          allUsers.push({
            name: getCellValue(rows[i].c[0]),
            role: getCellValue(rows[i].c[1]),
            account: getCellValue(rows[i].c[2]),
            password: getCellValue(rows[i].c[3])
          });
        }
      });

      rowsForm.forEach(row => {
        if (!row || !row.c) return;
        allUsers.push({
          name: getCellValue(row.c[1]),
          role: getCellValue(row.c[2]),
          account: getCellValue(row.c[3]),
          password: getCellValue(row.c[4])
        });
      });

      let found = allUsers.find(u => u.account === userVal && u.password === passVal);

      if (found) {
        currentUser = found;
        document.getElementById('user-name-display').textContent = currentUser.name;
        document.getElementById('user-role-badge').textContent = currentUser.role;
        showToast(`歡迎回來，${currentUser.name}！`, "success");
        showScreen('screen-main-menu');
      } else {
        showToast("帳號或密碼錯誤！或者帳號尚未開通", "error");
      }
    });

      const account = document.getElementById('reg-account').value.trim();
      const password = document.getElementById('reg-password').value.trim();

      if (!name || !account || !password) { showToast("請填寫所有欄位！", "error"); return; }

      showToast("1秒極速註冊並登入中...", "info");

      fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: "register", name: name, role: role, account: account, password: password })
      }).then(() => {
        currentUser = { name: name, role: role, account: account };
        document.getElementById('user-name-display').textContent = currentUser.name;
        document.getElementById('user-role-badge').textContent = currentUser.role;
        closeRegisterModal();
        showToast("註冊成功！已自動登入系統", "success");
        showScreen('screen-main-menu');
      }).catch(() => {
        showToast("網路異常，請稍後再試", "error");
      });
    });

    function logout() {
      currentUser = { name: '', role: '', account: '' };
      document.getElementById('login-account').value = '';
      document.getElementById('login-password').value = '';
      showScreen('screen-login');
      showToast("已安全登入系統", "info");
    }

    // ==========================================
    // 4. 題數選擇控管與選課測驗模組
    // ==========================================
    function openQuizSetup() {
      updateSubOptions('q');
      showScreen('screen-quiz-setup');
    }

    function selectQCount(val, btn) {
      document.querySelectorAll('.q-count-btn').forEach(b => {
        b.className = "q-count-btn py-2.5 rounded-xl border border-slate-700 bg-slate-800 text-slate-200 text-xs font-bold hover:border-cyan-500 transition";
      });
      btn.className = "q-count-btn py-2.5 rounded-xl border border-cyan-500 bg-cyan-500/20 text-cyan-300 text-xs font-bold hover:border-cyan-500 transition";

      if (val === 'CUSTOM') {
        document.getElementById('custom-count-box').classList.remove('hidden');
        selectedQCount = 'CUSTOM';
      } else {
        document.getElementById('custom-count-box').classList.add('hidden');
        selectedQCount = val;
      }
    }

    function startQuiz() {
      const stage = document.getElementById('q-stage').value;
      const subject = document.getElementById('q-subject').value;
      const edition = document.getElementById('q-edition').value;
      const scope = document.getElementById('q-scope').value;

      // 資料庫篩選
      let questions = VOCAB_GRAMMAR_DB.filter(item => {
        const matchStage = item.stage === stage;
        const matchSubject = item.subject === subject;
        const matchEdition = item.edition.includes(edition) || edition.includes(item.edition);
        const matchScope = scope.includes('全部') || item.scope.includes(scope) || scope.includes(item.scope);
        return matchStage && matchSubject && matchEdition && matchScope;
      });

      // 防呆：若查無嚴格配對則回退放寬
      if (questions.length === 0) {
        questions = VOCAB_GRAMMAR_DB.filter(item => item.stage === stage && item.subject === subject);
      }

      questions.sort(() => Math.random() - 0.5);

      // 計算最終選取的題數
      let finalCount = 10;
      if (selectedQCount === 'ALL') {
        finalCount = questions.length;
      } else if (selectedQCount === 'CUSTOM') {
        const customNum = parseInt(document.getElementById('q-custom-num').value) || 10;
        finalCount = Math.min(customNum, questions.length);
      } else {
        finalCount = Math.min(selectedQCount, questions.length);
      }

      activeQuizQuestions = questions.slice(0, finalCount);
      currentQIdx = 0;
      currentScore = 0;

      document.getElementById('quiz-score-num').textContent = currentScore;
      showScreen('screen-quiz-play');
      renderQuizQuestion();
    }

    function renderQuizQuestion() {
      const qData = activeQuizQuestions[currentQIdx];
      const total = activeQuizQuestions.length;

      document.getElementById('quiz-progress-text').textContent = `題目 ${currentQIdx + 1} / ${total}`;
      document.getElementById('quiz-progress-bar').style.width = `${((currentQIdx + 1) / total) * 100}%`;

      document.getElementById('quiz-q-type').textContent = qData.subject;
      document.getElementById('quiz-q-title').textContent = `請輸入「${qData.mean}」的英文`;

      const sentenceBox = document.getElementById('quiz-q-sentence');
      if (qData.sentence) {
        sentenceBox.classList.remove('hidden');
        sentenceBox.innerHTML = `💬 <b>例句提示：</b> ${qData.sentence.replace(new RegExp(qData.word, 'gi'), '_____')}`;
      } else {
        sentenceBox.classList.add('hidden');
      }

      const input = document.getElementById('quiz-answer-input');
      input.value = '';
      input.focus();
      document.getElementById('quiz-feedback').textContent = '';
    }

    document.getElementById('btn-quiz-submit').addEventListener('click', checkQuizAnswer);
    document.getElementById('quiz-answer-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') checkQuizAnswer(); });

    function checkQuizAnswer() {
      const input = document.getElementById('quiz-answer-input');
      const userAns = input.value.trim().toLowerCase();
      const qData = activeQuizQuestions[currentQIdx];
      const feedback = document.getElementById('quiz-feedback');

      if (!userAns) return;

      if (userAns === qData.word.toLowerCase()) {
        const pointPerQ = Math.round(100 / activeQuizQuestions.length);
        currentScore += pointPerQ;
        document.getElementById('quiz-score-num').textContent = currentScore;
        feedback.className = "text-sm font-bold mt-4 min-h-[24px] text-emerald-400";
        feedback.textContent = "✅ 正確！朗讀單字中...";
        speakText(qData.word);
      } else {
        feedback.className = "text-sm font-bold mt-4 min-h-[24px] text-rose-400";
        feedback.textContent = `❌ 答錯了！正確答案是: ${qData.word}`;
      }

      currentQIdx++;
      setTimeout(() => {
        if (currentQIdx < activeQuizQuestions.length) {
          renderQuizQuestion();
        } else {
          finishQuiz();
        }
      }, 1200);
    }

    function finishQuiz() {
      document.getElementById('result-final-score').textContent = currentScore;
      showScreen('screen-result');

      // 同步成績至 Google Apps Script 雲端後台
      const payload = {
        name: currentUser.name,
        account: currentUser.account,
        role: currentUser.role,
        targetStage: document.getElementById('q-stage').value,
        subject: document.getElementById('q-subject').value,
        edition: document.getElementById('q-edition').value,
        scope: document.getElementById('q-scope').value,
        score: currentScore
      };

      fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(() => {
        document.getElementById('result-sync-status').className = "text-xs text-emerald-400 bg-slate-900/60 py-2 px-4 rounded-lg inline-block mb-6 border border-emerald-500/30";
        document.getElementById('result-sync-status').innerHTML = '<i class="fa-solid fa-cloud-arrow-up mr-1"></i> 成績已成功寫入雲端資料庫！';
      }).catch(() => {
        document.getElementById('result-sync-status').textContent = '⚠️ 雲端備份傳送異常';
      });
    }

    // ==========================================
    // 5. 拼字練習館模組 (Spelling Practice)
    // ==========================================
    function openSpellingSetup() {
      updateSubOptions('s');
      showScreen('screen-spelling-setup');
    }

    let spellingQuestions = [];
    let currentSpellIdx = 0;

    function startSpelling() {
      const stage = document.getElementById('s-stage').value;
      const edition = document.getElementById('s-edition').value;
      const scope = document.getElementById('s-scope').value;

      spellingQuestions = VOCAB_GRAMMAR_DB.filter(item => {
        const matchStage = item.stage === stage;
        const matchEdition = item.edition.includes(edition) || edition.includes(item.edition);
        const matchScope = scope.includes('全部') || item.scope.includes(scope);
        return matchStage && matchEdition && matchScope && item.subject === '英文單字';
      });

      if (spellingQuestions.length === 0) {
        spellingQuestions = VOCAB_GRAMMAR_DB.filter(item => item.stage === stage && item.subject === '英文單字');
      }

      spellingQuestions.sort(() => Math.random() - 0.5);
      spellingQuestions = spellingQuestions.slice(0, 10);

      currentSpellIdx = 0;
      showScreen('screen-spelling-play');
      renderSpellingQuestion();
    }

    function renderSpellingQuestion() {
      const qData = spellingQuestions[currentSpellIdx];
      const total = spellingQuestions.length;

      document.getElementById('spell-progress-text').textContent = `進度 ${currentSpellIdx + 1} / ${total}`;
      document.getElementById('spell-word-mean').textContent = qData.mean;

      const sentenceBox = document.getElementById('spell-sentence-box');
      sentenceBox.innerHTML = `💬 例句：${qData.sentence.replace(new RegExp(qData.word, 'gi'), '<span class="font-bold text-purple-400 border-b-2 border-purple-400 px-1">_____</span>')}`;

      const input = document.getElementById('spell-input');
      input.value = '';
      input.focus();
      document.getElementById('spell-feedback').textContent = '';

      // 自動發音
      speakText(qData.word);
    }

    function playCurrentWordTTS() {
      if (spellingQuestions[currentSpellIdx]) {
        speakText(spellingQuestions[currentSpellIdx].word);
      }
    }

    document.getElementById('btn-spell-submit').addEventListener('click', checkSpellingAnswer);
    document.getElementById('spell-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') checkSpellingAnswer(); });

    function checkSpellingAnswer() {
      const input = document.getElementById('spell-input');
      const userAns = input.value.trim().toLowerCase();
      const qData = spellingQuestions[currentSpellIdx];
      const feedback = document.getElementById('spell-feedback');

      if (!userAns) return;

      if (userAns === qData.word.toLowerCase()) {
        feedback.className = "text-sm font-bold mt-4 min-h-[24px] text-emerald-400";
        feedback.textContent = "✨ 拼寫完美正確！";
        speakText(qData.word);
      } else {
        feedback.className = "text-sm font-bold mt-4 min-h-[24px] text-rose-400";
        feedback.textContent = `❌ 拼錯了！正確拼法是: ${qData.word}`;
      }

      currentSpellIdx++;
      setTimeout(() => {
        if (currentSpellIdx < spellingQuestions.length) {
          renderSpellingQuestion();
        } else {
          showToast("🎉 拼字練習完成！已將成果存入資料庫", "success");
          showScreen('screen-main-menu');
        }
      }, 1500);
    }

    // ==========================================
    // 6. 學習館卡片模組 (Learning Pavilion)
    // ==========================================
    function openLearningPavilion() {
      showScreen('screen-learning-pavilion');
      renderLearningCards();
    }

    function renderLearningCards() {
      const stage = document.getElementById('lp-stage').value;
      const subject = document.getElementById('lp-subject').value;
      const edition = document.getElementById('lp-edition').value;
      const scope = document.getElementById('lp-scope').value;

      const container = document.getElementById('learning-cards-list');
      container.innerHTML = '';

      const filtered = VOCAB_GRAMMAR_DB.filter(item => {
        const matchStage = (stage === '全部學歷' || item.stage === stage);
        const matchSubject = (subject === '全部題目' || item.subject === subject);
        const matchEdition = (edition === '全部版本' || item.edition.includes(edition));
        const matchScope = (scope.includes('全部') || item.scope.includes(scope));
        return matchStage && matchSubject && matchEdition && matchScope;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-500 py-8">尚無符合條件的單字與句子。</p>';
        return;
      }

      filtered.forEach(item => {
        container.innerHTML += `
          <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-3.5 text-left">
            <div class="flex justify-between items-center mb-1">
              <span class="text-base font-bold text-cyan-300">${item.word}</span>
              <button onclick="speakText('${item.word}')" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 text-cyan-400 rounded text-xs">
                <i class="fa-solid fa-volume-high mr-1"></i> 發音
              </button>
            </div>
            <div class="text-xs font-semibold text-emerald-400 mb-2">中文釋義：${item.mean}</div>
            <div class="text-xs text-slate-300 bg-slate-950/60 p-2.5 rounded-lg border border-slate-800/80">
              💬 <b>練習例句：</b> ${item.sentence}
              <button onclick="speakText('${item.sentence.replace(/'/g, "\\'")}')" class="ml-2 text-indigo-400 hover:underline">
                <i class="fa-solid fa-play text-[10px]"></i> 朗讀
              </button>
            </div>
          </div>
        `;
      });
    }

    // ==========================================
    // 7. 成績後台與身分權限控管 (Score Admin)
    // ==========================================
    async function loadAndShowScores() {
      showScreen('screen-admin');
      const tbody = document.getElementById('scores-tbody');
      const notice = document.getElementById('admin-notice');
      const bindBox = document.getElementById('bind-search-box');

      tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-1"></i> 讀取雲端成績紀錄中...</td></tr>';
      bindBox.classList.add('hidden');

      const rows = await fetchSheetData('成績紀錄');
      rawScoreRecords = [];

      for (let i = 1; i < rows.length; i++) {
        if (!rows[i] || !rows[i].c) continue;
        rawScoreRecords.push({
          time: getCellValue(rows[i].c[0]),
          name: getCellValue(rows[i].c[1]),
          account: getCellValue(rows[i].c[2]),
          role: getCellValue(rows[i].c[3]),
          subject: getCellValue(rows[i].c[5]),
          scope: getCellValue(rows[i].c[7]),
          score: getCellValue(rows[i].c[8])
        });
      }

      // 身分權限告示
      if (currentUser.role.includes('總管理員')) {
        notice.innerHTML = '🟢 <b>總管理員模式：</b>擁有全系統最高權限，可觀看所有人包含教職員與學生的成績。';
      } else if (currentUser.role.includes('教職員') || currentUser.role.includes('人事室') || currentUser.role.includes('處室') || currentUser.role.includes('校長')) {
        notice.innerHTML = '🟢 <b>教職員權限：</b>可觀看全校所有學生成績（自動隱藏總管理員之紀錄）。';
      } else if (currentUser.role.includes('老師') || currentUser.role.includes('導師') || currentUser.role.includes('家長')) {
        bindBox.classList.remove('hidden');
        notice.innerHTML = '🟡 <b>老師/家長權限：</b>可查看自身成績，並可於下方欄位搜尋輸入綁定學生之帳號查閱成績。';
      } else {
        notice.innerHTML = '⚪ <b>學生/個人權限：</b>僅可檢視您本人的測驗成績歷史紀錄。';
      }

      renderScoreTable();
    }

    function renderScoreTable(filterAccount = null) {
      const tbody = document.getElementById('scores-tbody');
      tbody.innerHTML = '';
      let count = 0;

      rawScoreRecords.forEach(rec => {
        let canView = false;

        if (currentUser.role.includes('總管理員')) {
          canView = true;
        } else if (currentUser.role.includes('教職員') || currentUser.role.includes('人事室') || currentUser.role.includes('處室') || currentUser.role.includes('校長')) {
          if (!rec.role.includes('總管理員')) canView = true;
        } else if (currentUser.role.includes('老師') || currentUser.role.includes('導師') || currentUser.role.includes('家長')) {
          if (rec.account === currentUser.account) canView = true;
          if (filterAccount && rec.account === filterAccount) {
            if (rec.role.includes('學生') || rec.role.includes('以上都沒有')) canView = true;
          }
        } else {
          if (rec.account === currentUser.account) canView = true;
        }

        if (canView) {
          count++;
          tbody.innerHTML += `
            <tr class="hover:bg-slate-800/50 transition">
              <td class="p-2">${rec.time.split(' ')[0]}</td>
              <td class="p-2 font-bold text-white">${rec.name}</td>
              <td class="p-2 text-slate-400">${rec.role.substring(0, 4)}</td>
              <td class="p-2">${rec.subject}</td>
              <td class="p-2 text-slate-400 truncate max-w-[100px]">${rec.scope}</td>
              <td class="p-2 font-bold text-emerald-400">${rec.score}</td>
            </tr>
          `;
        }
      });

      if (count === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-slate-500">尚無符合權限的成績紀錄。</td></tr>';
      }
    }

    function filterStudentScores() {
      const val = document.getElementById('bind-student-account').value.trim();
      if (!val) { showToast("請輸入學生的帳號！", "error"); return; }
      renderScoreTable(val);
    }
  </script>
