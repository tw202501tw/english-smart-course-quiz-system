<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英文智慧選課測驗系統</title>
  <style>
    :root { --bg: #0f172a; --box: #1e293b; --primary: #3b82f6; --accent: #ef4444; --text: #f8fafc; --success: #10b981; }
    body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    .container { background: var(--box); border-radius: 15px; padding: 25px; width: 90%; max-width: 600px; margin: 20px 0; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2, h3 { text-align: center; color: white; margin-top: 0; }
    .title-highlight { color: #38bdf8; }
    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #94a3b8; font-weight: bold; }
    input, select, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; box-sizing: border-box; background: #0f172a; color: white; font-size: 16px; margin-bottom: 10px; }
    input:focus, select:focus { outline: none; border-color: var(--primary); }
    button { background: var(--primary); border: none; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; color: white; }
    button:hover { opacity: 0.9; transform: translateY(-2px); }
    .btn-secondary { background: #475569; }
    .btn-secondary:hover { background: #64748b; }
    .btn-accent { background: var(--accent); }
    .hidden { display: none !important; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; margin-bottom: 15px; }
    
    /* 表格樣式 */
    .table-container { overflow-x: auto; margin-top: 15px; border-radius: 8px; border: 1px solid #334155; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; white-space: nowrap; }
    th, td { padding: 10px; border-bottom: 1px solid #334155; text-align: center; }
    th { background: #0f172a; color: #38bdf8; position: sticky; top: 0; }
    tr:hover { background: #334155; }
    
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
    .menu-btn { height: 100px; font-size: 18px; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .menu-btn span { font-size: 24px; margin-bottom: 8px; }
  </style>
</head>
<body>

  <!-- 1. 登入畫面 -->
  <div class="container" id="login-screen">
    <h2 class="title-highlight">英文智慧選課測驗系統</h2>
    <p style="font-size: 13px; color: #94a3b8; text-align:center;">支援主資料庫與備用帳號庫雙重登入驗證</p>
    <div class="input-group">
      <label>帳號</label>
      <input type="text" id="login-account" placeholder="請輸入帳號">
    </div>
    <div class="input-group">
      <label>密碼</label>
      <input type="password" id="login-password" placeholder="請輸入密碼">
    </div>
    <button id="login-btn">安全登入</button>
    <button id="go-register-btn" class="btn-secondary">註冊新帳號 (前往表單)</button>
    <p id="login-msg" style="color: var(--accent); text-align: center; font-weight: bold; margin-top: 15px;"></p>
  </div>

  <!-- 2. 主選單 -->
  <div class="container hidden" id="main-menu">
    <div class="header">
      <div>
        <h3 style="margin:0; text-align: left;" class="title-highlight">系統大廳</h3>
        <span id="user-name-display" style="color: #94a3b8; font-size: 14px;"></span>
      </div>
      <button id="logout-btn" style="width: auto; padding: 6px 15px;" class="btn-secondary">登出</button>
    </div>

    <div class="menu-grid">
      <button class="menu-btn" onclick="showScreen('quiz-setup-screen')"><span>📝</span>智慧選課測驗</button>
      <button class="menu-btn" style="background: #8b5cf6;" onclick="showScreen('learning-pavilion-screen')"><span>📚</span>學習館</button>
      <button class="menu-btn" style="background: #10b981; grid-column: span 2;" onclick="loadAndShowScores()"><span>📊</span>成績紀錄與後台</button>
    </div>
  </div>

  <!-- 3. 智慧選課測驗設定 (原七階段) -->
  <div class="container hidden" id="quiz-setup-screen">
    <div class="header">
      <h3 style="margin:0;" class="title-highlight">智慧選課與範圍設定</h3>
      <button onclick="showScreen('main-menu')" style="width: auto; padding: 5px 15px;" class="btn-secondary">返回</button>
    </div>
    <div id="selection-area">
      <div class="input-group"><label>Step 1: 個人學歷</label><select id="step1-stage"><option value="國小">國小</option><option value="國中" selected>國中</option><option value="高中">高中</option></select></div>
      <div class="input-group"><label>Step 2: 測驗科目</label><select id="step4-subject"><option value="英文單字">英文單字</option><option value="英文文法">英文文法</option></select></div>
      <div class="input-group"><label>Step 3: 版本選擇</label><select id="step5-edition"><option value="翰林版 (Han Lin)">翰林版 (Han Lin)</option><option value="康軒版 (Kang Hsuan)">康軒版 (Kang Hsuan)</option><option value="南一版 (Nan I)">南一版 (Nan I)</option></select></div>
      <div class="input-group"><label>Step 4: 版本學年度</label><select id="step6-year"><option value="115上學年度">115上學年度</option><option value="115下學年度">115下學年度</option></select></div>
      <div class="input-group"><label>Step 5: 課程/段考範圍</label><select id="step7-scope"><option value="第一次段考 (U1~U2)">第一次段考 (U1~U2)</option><option value="第二次段考/期中考 (U3~U4)">第二次段考/期中考 (U3~U4)</option><option value="全部單字">全部單字</option></select></div>
      <button id="start-quiz-btn" class="btn-accent" style="height: 50px; font-size: 18px;">開始測驗</button>
    </div>
  </div>

  <!-- 4. 學習館 (全新) -->
  <div class="container hidden" id="learning-pavilion-screen">
    <div class="header">
      <h3 style="margin:0; color: #8b5cf6;">📚 學習館</h3>
      <button onclick="showScreen('main-menu')" style="width: auto; padding: 5px 15px;" class="btn-secondary">返回</button>
    </div>
    
    <div class="input-group">
      <label>1. 要複習的學歷</label>
      <select><option value="全部學歷" selected>全部學歷</option><option value="國小">國小</option><option value="國中">國中</option><option value="高中">高中</option></select>
    </div>
    <div class="input-group">
      <label>2. 要複習的測驗題目</label>
      <select><option value="英文單字" selected>英文單字</option><option value="英文文法">英文文法</option></select>
    </div>
    <div class="input-group">
      <label>3. 要複習的版本</label>
      <select><option value="全部版本" selected>全部版本</option><option value="翰林版">翰林版</option><option value="康軒版">康軒版</option><option value="南一版">南一版</option></select>
    </div>
    <div class="input-group">
      <label>4. 要複習的版本學年度</label>
      <select><option value="最新的" selected>最新的</option><option value="115上學年度">115上學年度</option><option value="115下學年度">115下學年度</option></select>
    </div>
    <div class="input-group">
      <label>5. 要複習的課程 / 單元 / 段考範圍</label>
      <select><option value="全部課程 / 單元 / 段考範圍" selected>全部課程 / 單元 / 段考範圍</option><option value="第一次段考">第一次段考</option><option value="第二次段考">第二次段考</option></select>
    </div>
    
    <button style="background: #8b5cf6; height: 50px; font-size: 18px;" onclick="alert('學習館教材準備中，即將開放！')">進入複習模式</button>
  </div>

  <!-- 5. 成績紀錄與後台 -->
  <div class="container hidden" id="admin-screen" style="max-width: 900px;">
    <div class="header">
      <h3 style="margin:0; color: #10b981;">📊 成績紀錄與管理</h3>
      <button onclick="showScreen('main-menu')" style="width: auto; padding: 5px 15px;" class="btn-secondary">返回</button>
    </div>
    <p id="admin-notice" style="font-size: 13px; color: #94a3b8;"></p>
    
    <!-- 老師/家長 綁定查詢區塊 -->
    <div id="bind-search-area" class="input-group hidden" style="background: #0f172a; padding: 15px; border-radius: 8px;">
      <label style="color: #38bdf8;">🔍 綁定學生查詢 (老師/家長專用)</label>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="bind-student-account" placeholder="請輸入學生或學員的帳號" style="margin-bottom: 0;">
        <button onclick="filterBoundStudent()" style="width: 100px; margin: 0;">查詢</button>
      </div>
      <p style="font-size: 12px; color: #94a3b8; margin-top: 5px; margin-bottom: 0;">輸入帳號後可查看該學生的成績紀錄。</p>
    </div>

    <div class="table-container">
      <table id="scores-table">
        <thead>
          <tr><th>測驗時間</th><th>姓名</th><th>身分</th><th>科目</th><th>範圍</th><th>得分</th></tr>
        </thead>
        <tbody id="scores-tbody">
          <tr><td colspan="6">資料讀取中，請稍候...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 6. 測驗進行畫面 -->
  <div class="container hidden" id="quiz-screen">
    <h2 id="quiz-title" class="title-highlight">測驗進行中</h2>
    <div style="font-size: 26px; margin: 30px 0; font-weight: bold; text-align: center; color: #fff;" id="question-text">載入中...</div>
    <input type="text" id="answer-input" placeholder="請輸入答案 (英文)" autocomplete="off" style="text-align: center; font-size: 18px;">
    <button id="submit-btn" class="btn-accent" style="height: 50px; font-size: 18px;">送出答案</button>
    <p id="feedback-text" style="text-align: center; font-size: 18px; font-weight: bold; min-height: 25px;"></p>
    <div style="text-align: center; background: #0f172a; padding: 10px; border-radius: 8px; margin-top: 15px;">
      目前分數: <span id="score-display" style="color: #10b981; font-weight: bold; font-size: 24px;">0</span>
    </div>
  </div>

  <!-- 7. 測驗結果畫面 -->
  <div class="container hidden" id="result-screen">
    <h2 class="title-highlight">測驗結束！</h2>
    <div style="text-align: center; padding: 30px 0;">
      <p style="font-size: 18px; color: #94a3b8;">最終得分</p>
      <p id="final-score" style="color: var(--accent); font-weight: bold; font-size: 48px; margin: 10px 0;"></p>
    </div>
    <p id="save-status" style="text-align: center; color: #94a3b8; font-size: 14px; background: #0f172a; padding: 10px; border-radius: 8px;">正在同步成績至雲端資料庫...</p>
    <button id="result-back-btn" style="height: 50px; font-size: 18px;">回系統大廳</button>
  </div>

  <script>
    // ==========================================
    // 系統常數與 API 網址設定 (已自動填入)
    // ==========================================
    const SHEET_ID = '1p9ik9A9OJ-jWoS9IbouCZ34Dns-1U7CzIqjypdEI9AE';
    const GAS_POST_URL = 'https://script.google.com/macros/s/AKfycbxlfwiq0yQcq5gQLomaMoj1lqQFkj9DYC0h4mGw0k4OvhjoF-jxSYixZvBBS01yyw8/exec';
    const GOOGLE_FORM_URL = 'https://docs.google.com/forms/d/14xaOuEybmN1Slkuxj_icSyew7sjW4rmrKn2UYURySVs/viewform';

    let currentUser = { name: '', role: '', account: '' };
    let allScoresData = []; // 暫存所有成績資料供查詢過濾

    function showScreen(screenId) {
      document.querySelectorAll('.container').forEach(el => el.classList.add('hidden'));
      document.getElementById(screenId).classList.remove('hidden');
    }

    // ==========================================
    // 核心功能：透過 Google GViz 直接讀取試算表資料
    // ==========================================
    async function fetchSheetData(sheetName) {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
      try {
        const response = await fetch(url);
        const text = await response.text();
        const json = JSON.parse(text.substring(47).slice(0, -2));
        return json.table.rows;
      } catch (error) {
        console.error(`讀取 ${sheetName} 失敗:`, error);
        return [];
      }
    }

    function getCellValue(cell) {
      if (!cell || cell.v === null || cell.v === undefined) return '';
      return String(cell.v).trim();
    }

    // ==========================================
    // 登入邏輯 (雙重資料庫驗證)
    // ==========================================
    document.getElementById('go-register-btn').addEventListener('click', () => window.open(GOOGLE_FORM_URL, '_blank'));

    document.getElementById('login-btn').addEventListener('click', async () => {
      const userVal = document.getElementById('login-account').value.trim();
      const passVal = document.getElementById('login-password').value.trim();
      const msg = document.getElementById('login-msg');
      
      if(!userVal || !passVal) { msg.textContent = "⚠️ 請輸入帳號與密碼"; return; }

      msg.style.color = "#38bdf8";
      msg.textContent = "連線驗證中，請稍候...";

      // 1. 同時讀取「主資料庫」與「備用資料庫」
      const [rowsMain, rowsBackup1, rowsBackup2] = await Promise.all([
        fetchSheetData('帳號密碼儲存庫'),
        fetchSheetData('預備&備用帳號'),
        fetchSheetData('預備_備用帳號') // 檔案名稱防呆機制
      ]);

      const allRows = [...rowsMain, ...rowsBackup1, ...rowsBackup2];
      let loggedIn = false;

      for (let i = 1; i < allRows.length; i++) { 
        const row = allRows[i].c;
        if (!row) continue;
        const dbName = getCellValue(row[0]);
        const dbRole = getCellValue(row[1]);
        const dbAccount = getCellValue(row[2]);
        const dbPassword = getCellValue(row[3]);

        if (dbAccount === userVal && dbPassword === passVal) {
          currentUser = { name: dbName, role: dbRole, account: dbAccount };
          loggedIn = true;
          break;
        }
      }

      if (loggedIn) {
        msg.textContent = "";
        document.getElementById('user-name-display').textContent = `身分：${currentUser.role} | 姓名：${currentUser.name}`;
        showScreen('main-menu');
      } else {
        msg.style.color = "var(--accent)";
        msg.textContent = "❌ 帳號或密碼錯誤！或者尚未註冊。";
      }
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
      currentUser = { name: '', role: '', account: '' };
      document.getElementById('login-account').value = '';
      document.getElementById('login-password').value = '';
      document.getElementById('login-msg').textContent = '';
      showScreen('login-screen');
    });

    // ==========================================
    // 成績後台與嚴格權限控管
    // ==========================================
    async function loadAndShowScores() {
      showScreen('admin-screen');
      const tbody = document.getElementById('scores-tbody');
      const notice = document.getElementById('admin-notice');
      const bindSearchArea = document.getElementById('bind-search-area');
      tbody.innerHTML = '<tr><td colspan="6">資料讀取中，請稍候...</td></tr>';
      bindSearchArea.classList.add('hidden');

      const rows = await fetchSheetData('成績紀錄');
      allScoresData = [];

      // 解析成績資料 (假設格式：測驗時間, 姓名, 帳號, 身分, 目標學歷, 科目, 版本, 範圍, 得分)
      for (let i = 1; i < rows.length; i++) {
        if (!rows[i].c) continue;
        allScoresData.push({
          time: getCellValue(rows[i].c[0]),
          name: getCellValue(rows[i].c[1]),
          account: getCellValue(rows[i].c[2]),
          role: getCellValue(rows[i].c[3]),
          subject: getCellValue(rows[i].c[5]),
          scope: getCellValue(rows[i].c[7]),
          score: getCellValue(rows[i].c[8])
        });
      }

      renderScoreTable();
    }

    function renderScoreTable(searchAccount = null) {
      const tbody = document.getElementById('scores-tbody');
      const notice = document.getElementById('admin-notice');
      const bindSearchArea = document.getElementById('bind-search-area');
      tbody.innerHTML = '';
      let displayCount = 0;

      allScoresData.forEach(data => {
        let canView = false;
        
        // 權限邏輯判斷
        if (currentUser.role.includes('總管理員')) {
          canView = true;
          notice.textContent = "🟢 總管理員模式：可查看系統內所有成員的成績。";
        } 
        else if (currentUser.role.includes('教職員') || currentUser.role.includes('人事室') || currentUser.role.includes('處室') || currentUser.role.includes('校長')) {
          if (!data.role.includes('總管理員')) canView = true;
          notice.textContent = "🟢 教職員模式：可查看除總管理員外之所有學生成績。";
        }
        else if (currentUser.role.includes('老師') || currentUser.role.includes('導師') || currentUser.role.includes('家長')) {
          bindSearchArea.classList.remove('hidden');
          notice.textContent = "🟡 老師/家長模式：可查看自身成績，或於下方輸入帳號查詢綁定學生之成績。";
          
          if (data.account === currentUser.account) canView = true; // 看自己
          if (searchAccount && data.account === searchAccount) {
            // 查詢防護：只能查學生或不符合條件者
            if (data.role.includes('學生') || data.role.includes('以上都沒有')) canView = true;
          }
        }
        else {
          if (data.account === currentUser.account) canView = true; // 學生只能看自己
          notice.textContent = "⚪ 學生/一般模式：僅可查看您本人的成績紀錄。";
        }

        if (canView) {
          displayCount++;
          tbody.innerHTML += `<tr>
            <td>${data.time.split(' ')[0]}</td>
            <td>${data.name}</td>
            <td>${data.role.substring(0, 4)}</td>
            <td>${data.subject}</td>
            <td><div style="max-width: 150px; overflow: hidden; text-overflow: ellipsis;" title="${data.scope}">${data.scope}</div></td>
            <td style="color:#10b981; font-weight:bold;">${data.score}</td>
          </tr>`;
        }
      });

      if (displayCount === 0) {
        tbody.innerHTML = '<tr><td colspan="6">目前沒有可顯示的成績紀錄。</td></tr>';
      }
    }

    function filterBoundStudent() {
      const searchVal = document.getElementById('bind-student-account').value.trim();
      if (!searchVal) { alert("請輸入學生帳號！"); return; }
      renderScoreTable(searchVal);
    }

    // ==========================================
    // 測驗核心系統
    // ==========================================
    let currentQuestions = [
      {q:"蘋果", a:"apple"}, {q:"香蕉", a:"banana"}, {q:"學校", a:"school"}
    ];
    let currentQuestionIndex = 0, score = 0;

    document.getElementById('start-quiz-btn').addEventListener('click', () => {
      currentQuestions.sort(() => Math.random() - 0.5); 
      currentQuestionIndex = 0; score = 0;
      document.getElementById('score-display').textContent = score;
      showScreen('quiz-screen');
      loadQuestion();
    });

    const answerInput = document.getElementById('answer-input');
    const feedbackText = document.getElementById('feedback-text');

    function loadQuestion() {
      answerInput.value = ''; feedbackText.textContent = ''; answerInput.focus();
      document.getElementById('question-text').textContent = `請輸入「${currentQuestions[currentQuestionIndex].q}」的英文`;
    }

    document.getElementById('submit-btn').addEventListener('click', checkAnswer);
    answerInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') checkAnswer(); });

    function checkAnswer() {
      if(answerInput.value.trim() === '') return;
      const qData = currentQuestions[currentQuestionIndex];
      const userAnswer = answerInput.value.trim().toLowerCase();
      
      if (userAnswer === qData.a.toLowerCase()) {
        score += 10; document.getElementById('score-display').textContent = score;
        feedbackText.style.color = "#10b981"; feedbackText.textContent = "✅ 答對了！";
      } else {
        feedbackText.style.color = "var(--accent)"; feedbackText.textContent = `❌ 答錯了！正確答案是: ${qData.a}`;
      }
      currentQuestionIndex++;
      setTimeout(() => {
        if (currentQuestionIndex < currentQuestions.length) loadQuestion();
        else endQuiz();
      }, 1000);
    }

    function endQuiz() {
      showScreen('result-screen');
      document.getElementById('final-score').textContent = score;
      const statusEl = document.getElementById('save-status');
      statusEl.style.color = "#94a3b8";
      statusEl.textContent = "正在安全寫入成績至資料庫...";

      const payload = {
        name: currentUser.name, account: currentUser.account, role: currentUser.role,
        targetStage: document.getElementById('step1-stage').value,
        subject: document.getElementById('step4-subject').value,
        edition: document.getElementById('step5-edition').value,
        scope: document.getElementById('step7-scope').value,
        score: score
      };

      fetch(GAS_POST_URL, {
        method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
      }).then(() => {
        statusEl.style.color = "#10b981"; statusEl.textContent = "✅ 成績已成功寫入您的系統資料庫！";
      }).catch(() => {
        statusEl.style.color = "var(--accent)"; statusEl.textContent = "⚠️ 網路異常，成績傳送失敗。";
      });
    }

    document.getElementById('result-back-btn').addEventListener('click', () => showScreen('main-menu'));
  </script>
</body>
